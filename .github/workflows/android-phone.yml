# MIA on the phone (DEC-0019, the Phase 1 spike): builds android-phone/
# (MIA's own engine and screens inside an Android app, no computer),
# starts it on an Android emulator and checks she comes up and answers,
# then publishes the APK as the "phone-spike" release. The older companion
# app (android/) was retired on 2026-11-15 (DEC-0160).
name: MIA on the phone (spike)

on:
  push:
    branches: [master]
    paths:
      # The app carries MIA's engine and screens, so it rebuilds when they change.
      - "android-phone/**"
      - "core/**"
      - "server/**"
      - "web/**"
      - "modules/__init__.py"
      - "modules/module_base.py"
      - "config/default_config.json"
      - "data/model_bench_cases.json"
      - ".github/workflows/android-phone.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the release

concurrency:
  group: android-phone
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy builds with a desktop Python of the same version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: "8.13"

      # llama.cpp's server for MIA's own model (docs/PHONE_MODEL_TEST.md),
      # for the phone and the emulator. Cached by its pinned version.
      - name: Cache llama.cpp's server
        id: llama
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: android-phone/app/src/main/jniLibs
          key: llama-server-${{ hashFiles('android-phone/build_llama_server.sh') }}

      - name: Build llama.cpp's server for Android
        if: steps.llama.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build > /dev/null
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash android-phone/build_llama_server.sh

      # The smallest model the phone offers, to run the test on the emulator.
      - name: Cache the test model
        id: model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: models
          key: model-qwen2.5-1.5b-q4km

      - name: Download the test model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          ls -la models

      # The signing key, from the repository's secrets when they're set (DEC-0160); else the legacy key.
      - name: Signing key
        env:
          KEY_B64: ${{ secrets.MIA_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/mia-signing.keystore"
            echo "MIA_SIGNING_KEYSTORE=$RUNNER_TEMP/mia-signing.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the repository's secrets."
          else
            echo "::warning::MIA_SIGNING_KEYSTORE_B64 isn't set: signing with the legacy key."
          fi

      - name: Build the APK
        working-directory: android-phone
        env:
          MIA_SIGNING_PASSWORD: ${{ secrets.MIA_SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Size
        run: ls -la android-phone/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable the emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start MIA on an Android emulator and check her
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          disk-size: 8000M
          script: MODEL_FILE=models/qwen2.5-1.5b-instruct-q4_k_m.gguf MODEL_ID=qwen2.5-1.5b bash android-phone/ci_smoke.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: phone-spike-report
          path: |
            spike-report/
            android-phone/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the phone-spike release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-phone/app/build/outputs/apk/debug/app-debug.apk MIA-Phone-Test.apk
          gh release delete phone-spike --yes --cleanup-tag || true
          # A hiccup between deleting and creating left no download at all once
          # (2026-10-19): try a few times, a little apart (the tag's removal settles).
          for try in 1 2 3 4; do
            sleep $((try * 5))
            gh release create phone-spike MIA-Phone-Test.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "MIA on the phone: test build ${GITHUB_RUN_NUMBER}" \
              --notes "MIA running entirely on the phone, no computer (DEC-0019 spike). Installs beside the companion app. Built from ${GITHUB_SHA::7}." && exit 0
            gh release delete phone-spike --yes --cleanup-tag || true
          done
          exit 1
