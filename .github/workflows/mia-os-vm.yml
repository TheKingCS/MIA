# MIA OS in a virtual machine (PoC 2's second half and PoC 4's second; Zac said yes to the tests, Q-49, 2026-11-16):
# the image from os/Containerfile, installed onto a disk file by bootc itself, booted under QEMU with KVM on GitHub's
# machine, then:
#   1. it boots, and bootc reports the deployment;
#   2. MIA's runtime runs as the test user's systemd user service, from the image's /usr/lib/mia;
#   3. a second version of the image is staged with `bootc switch` and booted (an update);
#   4. `bootc rollback` boots the first version again (a rollback), with the user's data untouched.
# The test-only additions (SSH on, trust for a throwaway registry) are in
# os/poc/vm/Containerfile.test and never in the real image. Run by hand: it takes most of an hour.
name: MIA OS in a VM

on:
  # FW-01: on a change to how the image is built or started, and every day, as well as by hand. It takes most of an
  # hour, so it doesn't run on every push: the image copies the whole repository, and a change anywhere else in it
  # is tested here within a day (the build check, mia-os-poc.yml, does run on every push).
  push:
    branches: [master]
    paths:
      - "os/**"
      - "requirements.txt"
      - "config/default_config.json"
      - "core/runtime.py"
      - "core/config_manager.py"
      - "core/key_unlock.py"
      - "deploy/**"
      - ".github/workflows/mia-os-vm.yml"
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read  # FW-02: read the code, nothing more (a job that needs more says so itself)

concurrency:
  group: mia-os-vm
  # A new push replaces a run in progress; the daily scheduled run waits its turn instead of cancelling one.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Room (the runner's preinstalled toolchains aren't needed here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: KVM and QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf socat gdisk dosfstools btrfs-progs parted
          ls -l /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Build the image (tracked files only), then the two test versions
        run: |
          mkdir -p /tmp/mia-ctx && git archive --format=tar HEAD | tar -x -C /tmp/mia-ctx
          sudo podman build -f /tmp/mia-ctx/os/Containerfile -t localhost/mia-os:poc /tmp/mia-ctx
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v1 -t localhost/mia-os:test-v1 os/poc/vm
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v2 -t localhost/mia-os:test-v2 os/poc/vm
          # FW-04: two deliberately broken versions, for the rollback by itself.
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v3 --build-arg BREAK=selftest -t localhost/mia-os:test-v3 os/poc/vm
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v4 --build-arg BREAK=login -t localhost/mia-os:test-v4 os/poc/vm
      - name: A throwaway registry on the host holding version 2 (the VM reaches the host as 10.0.2.2)
        run: |
          sudo podman run -d --name reg -p 5000:5000 docker.io/library/registry:2
          sleep 3
          sudo podman push --tls-verify=false localhost/mia-os:test-v2 localhost:5000/mia-os:test-v2
      - name: Make a disk of version 1 (the image installs itself onto a disk file)
        run: |
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/poc
          mkdir -p /tmp/out && cp ~/.ssh/poc.pub /tmp/out/poc.pub
          truncate -s 40G /tmp/out/disk.raw
          # The layout a real install has (FW-04, 2026-11-19): EFI, a separate ext4 /boot, a Btrfs root. With /boot on
          # Btrfs, GRUB can't write its environment ("sparse file not allowed"), so greenboot's boot counting never
          # falls back: a broken update rebooted into itself for 25 minutes. bootc installs into the mounted layout.
          LOOP=$(sudo losetup -Pf --show /tmp/out/disk.raw)
          # A 1 MB BIOS boot partition too, as Fedora makes: bootupd installs GRUB for BIOS as well as EFI.
          sudo sgdisk -n1:0:+1M -t1:ef02 -c1:BIOS -n2:0:+600M -t2:ef00 -c2:EFI -n3:0:+1G -t3:8300 -c3:boot \
            -n4:0:0 -t4:8304 -c4:root "$LOOP"
          sudo partprobe "$LOOP"; sleep 2
          sudo mkfs.vfat -F 32 -n EFI "${LOOP}p2" && sudo mkfs.ext4 -q -L boot "${LOOP}p3" && sudo mkfs.btrfs -q -L root "${LOOP}p4"
          sudo mkdir -p /mnt/target && sudo mount "${LOOP}p4" /mnt/target
          sudo mkdir -p /mnt/target/boot && sudo mount "${LOOP}p3" /mnt/target/boot
          sudo mkdir -p /mnt/target/boot/efi && sudo mount "${LOOP}p2" /mnt/target/boot/efi
          BOOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p3")
          sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/target:/target -v /tmp/out:/output \
            localhost/mia-os:test-v1 \
            bootc install to-filesystem --generic-image --boot-mount-spec "UUID=$BOOT_UUID" \
            --root-ssh-authorized-keys /output/poc.pub /target
          sudo umount -R /mnt/target && sudo losetup -d "$LOOP"
          sudo chown "$(id -u)" /tmp/out/disk.raw && ls -lh /tmp/out/
      - name: Boot it
        run: |
          qemu-system-x86_64 -enable-kvm -cpu host -m 8G -smp 4 \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/out/disk.raw,format=raw,if=virtio \
            -netdev user,id=n0,hostfwd=tcp::2222-:22 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:/tmp/serial.log -monitor unix:/tmp/mon.sock,server,nowait -daemonize
          echo 'vm() { ssh -i ~/.ssh/poc -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 root@localhost "$@"; }' > ~/vm.sh
          echo 'as_mia() { vm "runuser -l mia -c '"'"'export XDG_RUNTIME_DIR=/run/user/\$(id -u); $1'"'"'"; }' >> ~/vm.sh
      - name: 1. It boots, and bootc reports the deployment
        run: |
          . ~/vm.sh
          for i in $(seq 1 90); do vm true 2>/dev/null && break; sleep 10; done
          vm 'cat /usr/lib/mia/POC_IMAGE_MARK; bootc status; systemctl is-system-running || true; rpm -q ollama ollama-rocm cage; findmnt -no FSTYPE /sysroot'
          vm 'findmnt -o TARGET,SOURCE,FSTYPE /boot /boot/efi /sysroot; grub2-editenv list'  # /boot its own ext4, writable by GRUB
          test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v1
      - name: 2. MIA's runtime runs as a person's service, from the image
        run: |
          . ~/vm.sh
          # The homes as a Fedora install has them: their own Btrfs subvolume, so the snapshot before an update
          # (os/files/mia-update-apply) has something to take. Made while it's still empty.
          vm '[ -z "$(ls -A /var/home)" ] && rmdir /var/home && btrfs subvolume create /var/home && restorecon -v /var/home; btrfs subvolume show /var/home | head -n 2'
          vm 'useradd -m mia && loginctl enable-linger mia && sleep 5'
          as_mia 'systemctl --user daemon-reload; systemctl --user enable --now mia-runtime'
          for i in $(seq 1 60); do as_mia 'grep -q "The MIA Runtime is up" ~/.local/share/mia/logs/mia.log' 2>/dev/null && break; sleep 5; done
          as_mia 'grep "The MIA Runtime is up" ~/.local/share/mia/logs/mia.log; systemctl --user is-active mia-runtime'
          as_mia 'echo kept-by-him > ~/his-file.txt'
          vm 'ps -o user= -C python | sort -u; id -u mia'
      - name: FW-04 health after boot, readiness and the watchdog
        run: |
          . ~/vm.sh
          vm 'rpm -q greenboot; systemctl list-unit-files "greenboot*" --no-legend'
          # What the image turns on, and bootc's own fetch-and-restart timer masked: checked, not only printed.
          test "$(vm 'systemctl is-enabled greenboot-healthcheck.service')" = enabled
          test "$(vm 'systemctl is-enabled mia-update-stage.timer')" = enabled
          test "$(vm 'systemctl is-enabled mia-update-snapshot.service')" = enabled
          test "$(vm 'systemctl is-enabled bootc-fetch-apply-updates.timer' || true)" = masked
          vm 'systemctl status greenboot-healthcheck.service --no-pager | head -n 12; journalctl -b --no-pager -u greenboot-healthcheck.service | tail -n 40' || true
          vm 'grub2-editenv list 2>/dev/null || true; ls /etc/greenboot/check/required.d /etc/greenboot/check/wanted.d'
          # Her runtime as a notify service: its type, watchdog and the status she reports.
          as_mia 'systemctl --user show mia-runtime -p Type -p WatchdogUSec -p StatusText -p ActiveState'
          as_mia 'systemctl --user show mia-runtime -p StatusText' | grep -E "MIA is up \((core|models|all)\)"
          # The self-test as greenboot runs it: a dynamic user on an empty folder.
          vm '/etc/greenboot/check/required.d/43-mia-self-test.sh'
      - name: MIA's session under KWin (FW-03), her front end and the recovery page
        run: |
          . ~/vm.sh
          # KWin's virtual display: the session's own compositor, with no screen. First with her runtime running
          # (the shell shows her front end), then with it stopped (the recovery page after 30 seconds).
          cat > /tmp/session_test.sh <<'EOS'
          #!/bin/bash
          set -e
          export XDG_RUNTIME_DIR=/run/user/$(id -u) DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          export QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu
          for i in $(seq 1 30); do test -s "$XDG_RUNTIME_DIR/mia/desktop.json" && break; sleep 2; done
          ls -l "$XDG_RUNTIME_DIR/mia/desktop.json"
          run_session() {
            MIA_SHELL_ARGS="--screenshot /var/tmp/shell-$1.png --after $2" timeout 150 kwin_wayland --virtual \
              --width 1280 --height 800 --no-lockscreen --exit-with-session=/usr/lib/mia/os/files/mia-shell \
              > /var/tmp/kwin-$1.log 2>&1 || true
            grep -E "showing:|saved:" /var/tmp/kwin-$1.log || { tail -n 40 /var/tmp/kwin-$1.log; true; }
          }
          run_session front 25
          grep -q "showing: front end" /var/tmp/kwin-front.log
          systemctl --user stop mia-runtime
          run_session recovery 40
          grep -q "showing: recovery" /var/tmp/kwin-recovery.log
          systemctl --user start mia-runtime
          pkill -u "$(id -u)" -x kwin_wayland || true  # nothing of the test left running into the update's reboot
          test -s /var/tmp/shell-front.png && test -s /var/tmp/shell-recovery.png
          EOS
          vm 'cat > /var/tmp/session_test.sh && chmod 755 /var/tmp/session_test.sh' < /tmp/session_test.sh
          vm 'runuser -l mia -c /var/tmp/session_test.sh'
          mkdir -p /tmp/shots-session
          vm 'cat /var/tmp/shell-front.png' > /tmp/shots-session/shell-front.png
          vm 'cat /var/tmp/shell-recovery.png' > /tmp/shots-session/shell-recovery.png
          ls -l /tmp/shots-session
      - name: The session's screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mia-session-screenshots
          path: /tmp/shots-session/
          if-no-files-found: ignore
      - name: FW-03 at the login screen, by keyboard, Plasma one choice away
        run: |
          . ~/vm.sh
          mkdir -p /tmp/shots
          mon() { printf '%s\n' "$1" | socat - UNIX-CONNECT:/tmp/mon.sock > /dev/null; sleep 1; }
          shot() { mon "screendump /tmp/shots/$1.png -f png"; ls -l "/tmp/shots/$1.png" || true; }
          keys() { for k in "$@"; do mon "sendkey $k"; done; }
          state() { as_mia 'cat $XDG_RUNTIME_DIR/mia/shell-state 2>/dev/null' || true; }
          # How /boot is mounted before any login (ostree must remount it read-write at shutdown to apply an update).
          vm 'findmnt -o TARGET,SOURCE,FSTYPE,OPTIONS /boot /boot/efi; systemctl is-active boot.automount boot-efi.automount' || true
          # What runs the login screen here, and its settings (the session's name on inspection). Whether it knows a
          # default-session setting at all isn't proved by this test, which logs in automatically into a named one.
          vm 'strings /usr/bin/plasmalogin 2>/dev/null | grep -i -m 5 "DefaultSession\|LastSession" || echo "no DefaultSession setting found in plasmalogin"' || true
          vm 'rpm -qa | grep -iE "sddm|plasmalogin|plasma-login" ; systemctl status display-manager --no-pager | head -n 4; ls /usr/share/wayland-sessions /etc/sddm.conf.d /etc/plasmalogin.conf.d 2>&1; cat /etc/sddm.conf.d/*mia* /etc/plasmalogin.conf.d/*mia* 2>&1' || true
          # Log in at the login screen as the test person, into MIA's session.
          vm 'for d in /etc/sddm.conf.d /etc/plasmalogin.conf.d; do mkdir -p $d; printf "[Autologin]\nUser=mia\nSession=mia.desktop\nRelogin=true\n" > $d/zz-test-autologin.conf; done'
          as_mia 'rm -f $XDG_RUNTIME_DIR/mia/shell-state'
          start=$(date +%s.%N)
          vm 'systemctl restart display-manager'
          for i in $(seq 1 90); do state | grep -q "front end loaded" && break; sleep 1; done
          echo "login to her front end loaded: $(state | awk -v s=$start '{printf "%.1f s (%s)\n", $NF - s, $0}' | tail -n 1)"
          shot 1-mia-session
          state | grep -q "front end"
          # An ordinary window beside her: a terminal in her session.
          as_mia 'WAYLAND_DISPLAY=wayland-0 nohup konsole > /dev/null 2>&1 &'; sleep 8
          shot 2-konsole-beside-her
          as_mia 'pgrep -x konsole' && as_mia 'pkill -x konsole' || echo "konsole didn't open"
          # The shell dies and comes back by itself.
          as_mia 'pkill -f "gui.os_shell"'; as_mia 'rm -f $XDG_RUNTIME_DIR/mia/shell-state'
          for i in $(seq 1 60); do state | grep -q "front end" && break; sleep 1; done
          echo "after the shell was killed: $(state)"
          state | grep -q "front end"
          # Her runtime stopped: the recovery page, then the keyboard alone opens a terminal from it.
          as_mia 'systemctl --user stop mia-runtime; pkill -f "gui.os_shell"'
          for i in $(seq 1 90); do state | grep -q recovery && break; sleep 1; done
          echo "with her runtime stopped: $(state)"
          state | grep -q recovery
          shot 3-recovery
          keys tab tab ret; sleep 8
          shot 4-terminal-by-keyboard
          as_mia 'pgrep -x konsole' && echo "a terminal opened by keyboard alone"
          as_mia 'pkill -x konsole; systemctl --user start mia-runtime' || true
          # Plasma, one choice away: the same login into Plasma, timed to its shell.
          vm 'for d in /etc/sddm.conf.d /etc/plasmalogin.conf.d; do sed -i "s/^Session=.*/Session=plasma.desktop/" $d/zz-test-autologin.conf; done; loginctl terminate-user mia || true'
          start=$(date +%s)
          vm 'systemctl restart display-manager'
          for i in $(seq 1 120); do as_mia 'pgrep -x plasmashell' > /dev/null 2>&1 && break; sleep 1; done
          echo "login to Plasma's shell started: $(( $(date +%s) - start )) s"
          # Usable when the splash screen has gone.
          for i in $(seq 1 120); do as_mia 'pgrep -x ksplashqml' > /dev/null 2>&1 || break; sleep 1; done
          echo "login to Plasma's desktop, splash gone: $(( $(date +%s) - start )) s"
          sleep 3; shot 5-plasma
          as_mia 'pgrep -x plasmashell'
          for i in $(seq 1 90); do [ "$(as_mia 'systemctl --user is-active mia-runtime')" = active ] && break; sleep 2; done
          as_mia 'systemctl --user is-active mia-runtime'
          # Back as it was for the steps after: no automatic login.
          vm 'rm -f /etc/sddm.conf.d/zz-test-autologin.conf /etc/plasmalogin.conf.d/zz-test-autologin.conf; loginctl terminate-user mia || true; systemctl restart display-manager'
          sleep 5; as_mia 'systemctl --user start mia-runtime' || true
          # How /boot is mounted after a desktop session (the update after this needs it remountable).
          vm 'findmnt -o TARGET,SOURCE,FSTYPE,OPTIONS /boot /boot/efi; systemctl is-active boot.automount boot-efi.automount' || true
      - name: The login screen's screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mia-login-screenshots
          path: /tmp/shots/
          if-no-files-found: ignore
      - name: FW-06 the system helper, its fixed operations and polkit
        run: |
          . ~/vm.sh
          # One helper call: the method and its one text argument (as a D-Bus string), if any.
          cat > /tmp/helper_call.sh <<'EOS'
          #!/bin/sh
          exec gdbus call --system --dest org.mia.System1 --object-path /org/mia/System1 --method "org.mia.System1.$1" ${2:+"'$2'"}
          EOS
          vm 'cat > /var/tmp/helper_call.sh && chmod 755 /var/tmp/helper_call.sh' < /tmp/helper_call.sh
          hc() { vm "/var/tmp/helper_call.sh $*"; }
          # Installed, its policy known (his password every time), and nothing of it running until called (A6).
          vm 'test -x /usr/libexec/mia/mia-system-helper && pkaction --action-id org.mia.system1.power --verbose | grep -q "implicit active: *auth_self"'
          if vm 'systemctl is-active --quiet mia-system-helper'; then echo "the helper runs before any call"; exit 1; fi
          # Hostile arguments: refused by the helper's own rules, even from root, before polkit is asked (A8).
          if hc RestartUnit sshd.service; then echo "an unlisted unit was restarted"; exit 1; fi
          if hc Power halt; then echo "a power word outside the list was taken"; exit 1; fi
          if hc Format x; then echo "a method that isn't one was answered"; exit 1; fi
          vm 'journalctl -u mia-system-helper --no-pager | grep -q "refused RestartUnit"'
          # Nobody at the desk to confirm it (a session over SSH isn't one): refused, nothing restarted.
          if as_mia '/var/tmp/helper_call.sh RestartUnit ollama.service'; then echo "restarted with no one confirming"; exit 1; fi
          # A test-only polkit rule stands in for his password in the dialog: then it's done, and the journal says so.
          cat > /tmp/90-mia-test.rules <<'EOS'
          polkit.addRule(function (action, subject) {
            if (action.id == "org.mia.system1.restart-unit" && subject.user == "mia") { return polkit.Result.YES; }
          });
          EOS
          vm 'cat > /etc/polkit-1/rules.d/90-mia-test.rules' < /tmp/90-mia-test.rules
          sleep 3
          as_mia '/var/tmp/helper_call.sh RestartUnit ollama.service' | grep -q "restarted ollama.service"
          vm 'journalctl -u mia-system-helper --no-pager | grep -q "done RestartUnit"'
          vm 'rm /etc/polkit-1/rules.d/90-mia-test.rules'
          # Root only while called: a minute idle and it's gone.
          sleep 75
          if vm 'systemctl is-active --quiet mia-system-helper'; then echo "the helper stayed running"; exit 1; fi
          vm 'journalctl -u mia-system-helper --no-pager | tail -n 12'
      - name: The whole suite inside the image, on its own Python and packages (FW-02)
        run: |
          . ~/vm.sh
          # The repository's tracked files (the tests read folders the image leaves out), run with the image's venv.
          git archive --format=tar HEAD | vm 'rm -rf /var/tmp/mia-suite && mkdir -p /var/tmp/mia-suite && tar -x -C /var/tmp/mia-suite && chown -R mia /var/tmp/mia-suite'
          cat > /tmp/suite.sh <<'EOS'
          #!/bin/bash
          cd /var/tmp/mia-suite
          # A repository of its own, as a checkout is (a few tests read the commit they run on)
          git init -q && git add -A && git -c user.name=suite -c user.email=suite@vm.local commit -qm "the suite's copy"
          export QT_QPA_PLATFORM=offscreen PYTHONDONTWRITEBYTECODE=1
          timeout 3000 /usr/lib/mia/venv/bin/python -m pytest -q -p no:cacheprovider > /var/tmp/suite.log 2>&1
          code=$?
          tail -n 40 /var/tmp/suite.log
          exit $code
          EOS
          vm 'cat > /var/tmp/suite.sh && chmod 755 /var/tmp/suite.sh' < /tmp/suite.sh
          vm 'runuser -l mia -c /var/tmp/suite.sh'
      - name: FW-07b the move to MIA OS rehearsed on synthetic data, in the image
        run: |
          . ~/vm.sh
          # Stores laid out as on Windows, a real backup, MIA's own restore into a fresh folder, every store compared
          # by count and content hash; then one record changed by hand must be named (os/poc/vm/move_rehearsal.py).
          vm 'runuser -l mia -c "rm -rf /var/tmp/move && /usr/lib/mia/venv/bin/python /var/tmp/mia-suite/os/poc/vm/move_rehearsal.py /var/tmp/mia-suite /var/tmp/move"' | tee /tmp/move.log
          grep -q "stores matched after the restore" /tmp/move.log
      - name: 3. An update to version 2, booted
        run: |
          . ~/vm.sh
          vm 'findmnt -o TARGET,FSTYPE,OPTIONS /boot; systemctl cat boot.automount ostree-finalize-staged.service | grep -E "TimeoutIdle|RequiresMounts"' || true
          vm 'bootc switch --transport registry 10.0.2.2:5000/mia-os:test-v2 && bootc status | grep -A3 staged; systemctl reboot' || true
          # Down first (a shutdown that takes its time must not be mistaken for the new boot), then up.
          for i in $(seq 1 60); do vm true 2>/dev/null || break; sleep 5; done
          for i in $(seq 1 90); do vm true 2>/dev/null && break; sleep 10; done
          # The previous boot's shutdown: ostree applies a staged update there.
          vm 'journalctl -b -1 --no-pager -u ostree-finalize-staged | tail -n 20; journalctl -b -1 --no-pager -p warning | tail -n 30' || true
          vm 'cat /usr/lib/mia/POC_IMAGE_MARK; bootc status'
          test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v2
          test "$(as_mia 'cat ~/his-file.txt')" = kept-by-him
      - name: 4. A rollback to version 1, booted, his data untouched
        run: |
          . ~/vm.sh
          vm 'bootc rollback && bootc status | grep -A3 staged; systemctl reboot' || true
          # Down first (a shutdown that takes its time must not be mistaken for the new boot), then up.
          for i in $(seq 1 60); do vm true 2>/dev/null || break; sleep 5; done
          for i in $(seq 1 90); do vm true 2>/dev/null && break; sleep 10; done
          # The previous boot's shutdown: ostree applies a staged update there.
          vm 'journalctl -b -1 --no-pager -u ostree-finalize-staged | tail -n 20; journalctl -b -1 --no-pager -p warning | tail -n 30' || true
          vm 'cat /usr/lib/mia/POC_IMAGE_MARK; bootc status'
          test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v1
          test "$(as_mia 'cat ~/his-file.txt')" = kept-by-him
          sleep 30
          as_mia 'grep -c "The MIA Runtime is up" ~/.local/share/mia/logs/mia.log; systemctl --user is-active mia-runtime'
      - name: FW-04 the night's update staged by itself, applied when he restarts, with its snapshot
        run: |
          . ~/vm.sh
          up_again() { for i in $(seq 1 60); do vm true 2>/dev/null || break; sleep 5; done; for i in $(seq 1 90); do vm true 2>/dev/null && break; sleep 10; done; }
          vm 'systemctl list-timers mia-update-stage.timer --no-pager'
          # Where updates come from, as an install sets it once (the release registry; here the host's test one).
          sudo podman push --tls-verify=false localhost/mia-os:test-v1 localhost:5000/mia-os:auto
          vm 'bootc switch --transport registry 10.0.2.2:5000/mia-os:auto'
          # A new version is published; the night's staging service (what the 03:00 timer runs) stages it.
          sudo podman push --tls-verify=false localhost/mia-os:test-v2 localhost:5000/mia-os:auto
          vm 'systemctl start mia-update-stage.service && bootc status | grep -A4 staged'
          # She never restarts the computer herself. He does (here, the test): at that shutdown the snapshot is taken
          # (mia-update-snapshot.service), then ostree applies the update.
          vm 'systemctl reboot' || true
          up_again
          vm 'cat /usr/lib/mia/POC_IMAGE_MARK; ls /var/mia-snapshots; journalctl -b -1 --no-pager -u mia-update-snapshot.service | tail -n 5' || true
          test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v2
          test "$(as_mia 'cat ~/his-file.txt')" = kept-by-him
          # The snapshot taken before the restart holds his file as it was.
          vm 'ls /var/mia-snapshots | grep -q "^home-" && cat /var/mia-snapshots/home-*/mia/his-file.txt' | grep -q kept-by-him
      - name: FW-04 two broken updates roll back by themselves, his data untouched
        run: |
          . ~/vm.sh
          up_again() { for i in $(seq 1 60); do vm true 2>/dev/null || break; sleep 5; done; for i in $(seq 1 90); do vm true 2>/dev/null && break; sleep 10; done; }
          for broken in v3 v4; do
            echo "== $broken: published, staged, and applied at a restart; greenboot must bring v2 back"
            sudo podman push --tls-verify=false localhost/mia-os:test-$broken localhost:5000/mia-os:auto
            vm 'systemctl start mia-update-stage.service'
            # the broken version really is staged
            vm 'bootc status --format json' | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["status"].get("staged") else 1)'
            vm 'systemctl reboot' || true
            up_again
            seen=""
            for i in $(seq 1 120); do
              mark=$(vm cat /usr/lib/mia/POC_IMAGE_MARK 2>/dev/null || true)
              [ -n "$mark" ] && [ "$mark" != "${seen##* }" ] && seen="$seen $mark" && echo "booted: $mark"
              if [ "$mark" = v2 ] && vm 'systemctl is-active --quiet greenboot-healthcheck.service' 2>/dev/null; then break; fi
              sleep 10
            done
            vm 'cat /usr/lib/mia/POC_IMAGE_MARK; grub2-editenv list; journalctl --no-pager -u greenboot-healthcheck.service -b -1 | grep -E "ERROR|failed|rollback|reboot" | tail -n 8' || true
            echo "$seen" | grep -q "$broken"  # the broken version did boot; v2 came back after it, not instead of it
            test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v2
            test "$(as_mia 'cat ~/his-file.txt')" = kept-by-him
          done
      - name: The VM's console, for the record
        if: always()
        run: tail -n 80 /tmp/serial.log || true
