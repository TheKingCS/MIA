# MIA on Windows (2026-10-05, DEC-0015): MIA's main home is the owner's
# Windows PC, and nobody can run commands on it right now, so GitHub's
# own Windows machines stand in for it on every push:
#   1. install: the real installer (install.ps1), as the owner would run it;
#   2. tests:   the full test suite, a headless app boot, and the web
#               front end's device check (tools/web_check.py);
#   3. phone-libraries: the server's tests on the phone's own Python and
#               libraries (android-phone/app/build.gradle.kts: FastAPI
#               before 0.100, pydantic 1), so a route that breaks only on
#               the phone is caught here (2026-11-10).
# Results: the Actions tab, or Claude reads them through the GitHub API.
name: Windows

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "android/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1, like double-clicking install.bat (pwsh 7 hid
      # a 5.1-only stop: the Microsoft Store's "python" placeholder, 2026-10-19).
      - name: Finding Python survives the Microsoft Store placeholder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fake = Join-Path $env:RUNNER_TEMP "store-python"
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content (Join-Path $fake "python.bat") "@echo Python was not found; run without arguments to install from the Microsoft Store 1>&2`r`n@exit /b 9009"
          $env:Path = "$fake;$env:Path"
          . ./deploy/find_python.ps1
          if (Test-Python "python") { throw "the placeholder counted as Python" }
          $found = Find-Python
          Write-Host "Found: $found"
          if (-not $found) { throw "the real Python wasn't found" }
      - name: Run the installer (no Ollama, voice models or Tesseract downloads)
        shell: powershell
        run: ./install.ps1 -Yes -NoOllama -NoVoice -NoTesseract
      - name: Home-PC setup, dry run (setup_home_pc.ps1 says what it would do)
        timeout-minutes: 10
        shell: powershell
        run: ./setup_home_pc.ps1 -DryRun
      - name: Home-PC readiness check runs (it reports what's missing here)
        timeout-minutes: 10
        shell: pwsh
        run: |
          .venv\Scripts\python tools\pc_check.py
          if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 2) { exit 0 }  # 2: ready-or-not, said; 1 would be a crash
          exit $LASTEXITCODE

  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MIA's packages
        run: python -m pip install -r requirements.txt
      - name: Test suite
        # Qt's normal Windows display mode, like the real PC (the headless
        # "offscreen" mode has no fonts on Windows, so test PDFs came out blank).
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-report.xml --deselect tests/test_navigation_module.py::test_sun_moon_summary_for_real_coordinates_has_sensible_shape
      - name: Name the failed tests where the run's page shows them (its log needs a sign-in)
        if: failure()
        env:
          PYTHONUTF8: "1"
        run: python -m tools.ci_failures pytest-report.xml
      - name: Web front end device check
        if: always()
        env:
          PYTHONUTF8: "1"
        run: python -m tools.web_check
      - name: Every web page opens without an error (tools/page_check.py, headless Edge, demo mode)
        if: always()
        env:
          PYTHONUTF8: "1"
        run: python -m tools.page_check

  phone-libraries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the phone's (Chaquopy)
      - name: The phone's libraries (keep in step with build.gradle.kts)
        env:
          SKIP_CYTHON: "1"  # pydantic 1 as pure Python, as on the phone
        run: |
          python -m pip install --no-binary pydantic "fastapi==0.99.1" "pydantic==1.10.27" "uvicorn==0.54.0"             cryptography "astral==3.2" "mutagen==1.48.1" certifi
          python -m pip install pytest "httpx<0.28"  # tests only: Starlette 0.27's test client needs httpx before 0.28
      - name: The server's tests on them
        env:
          PYTHONUTF8: "1"
        # Not on the phone, so not tested here: web push (pywebpush), numpy (startup sounds, the guitar check), and
        # one test that uses a newer test client's option.
        run: >
          python -m tools.cloud_tests tests/test_server_app.py tests/test_home_link.py tests/test_store_lock.py
          tests/test_sync.py -q -p no:cacheprovider
          --deselect tests/test_server_app.py::test_vapid_public_key_returns_a_real_key
          --deselect tests/test_server_app.py::test_push_test_sends_via_webpush_with_the_right_subscription
          --deselect tests/test_server_app.py::test_learning_paths_list_and_a_guitar_check_is_heard
          --deselect tests/test_server_app.py::test_a_startup_sound_to_hear_before_choosing
          --deselect tests/test_server_app.py::test_the_recovery_key_is_shown_only_on_this_pc_with_the_password_and_is_logged
