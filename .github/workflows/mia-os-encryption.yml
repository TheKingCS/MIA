# MIA OS's encrypted disk in a virtual machine (FW-05, DEC-0277, Q-106): Secure Boot on (OVMF with Microsoft's keys), a
# software TPM (swtpm), the image installed onto a LUKS2 disk with a temporary passphrase, then os/files/mia-disk-enrol
# makes a recovery key and enrols the TPM (PCR 7) with a PIN. Checked:
#   1. a boot asks only for the PIN, and opens with it;
#   2. after an update, the PIN still opens it: no recovery key asked for;
#   3. with Secure Boot turned off, the TPM refuses and the recovery key opens it.
# The test types at the boot prompts on the VM's serial line (os/poc/vm/type_at_prompt.sh), knowing when from the
# serial log. The recovery key here belongs to a throwaway VM and is printed in this log; a real one is never printed
# or kept.
name: MIA OS encrypted disk in a VM

on:
  push:
    branches: [master]
    paths:
      - "os/files/mia-disk-enrol"
      - "os/files/dracut-mia-tpm.conf"
      - "os/poc/vm/**"
      - ".github/workflows/mia-os-encryption.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mia-os-encryption
  cancel-in-progress: true

jobs:
  encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Room, KVM, QEMU with Secure Boot firmware, a software TPM
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools socat gdisk \
            dosfstools btrfs-progs parted cryptsetup
          ls -l /dev/kvm && sudo chmod 666 /dev/kvm
          ls /usr/share/OVMF/
      - name: Build the image and two test versions
        run: |
          mkdir -p /tmp/mia-ctx && git archive --format=tar HEAD | tar -x -C /tmp/mia-ctx
          sudo podman build -f /tmp/mia-ctx/os/Containerfile -t localhost/mia-os:poc /tmp/mia-ctx
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v1 -t localhost/mia-os:test-v1 os/poc/vm
          sudo podman build -f os/poc/vm/Containerfile.test --build-arg MARK=v2 -t localhost/mia-os:test-v2 os/poc/vm
          sudo podman run -d --name reg -p 5000:5000 docker.io/library/registry:2 && sleep 3
          sudo podman push --tls-verify=false localhost/mia-os:test-v2 localhost:5000/mia-os:test-v2
      - name: An encrypted disk (LUKS2 root, ext4 /boot), installed with a temporary passphrase
        run: |
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/poc
          mkdir -p /tmp/out && cp ~/.ssh/poc.pub /tmp/out/poc.pub
          truncate -s 40G /tmp/out/disk.raw
          LOOP=$(sudo losetup -Pf --show /tmp/out/disk.raw)
          sudo sgdisk -n1:0:+1M -t1:ef02 -c1:BIOS -n2:0:+600M -t2:ef00 -c2:EFI -n3:0:+1G -t3:8300 -c3:boot \
            -n4:0:0 -t4:8304 -c4:root "$LOOP"
          sudo partprobe "$LOOP"; sleep 2
          printf 'install-temporary' | sudo cryptsetup luksFormat --type luks2 --batch-mode "${LOOP}p4" -
          printf 'install-temporary' | sudo cryptsetup open "${LOOP}p4" root --key-file -
          LUKS_UUID=$(sudo cryptsetup luksUUID "${LOOP}p4")
          sudo mkfs.vfat -F 32 -n EFI "${LOOP}p2" && sudo mkfs.ext4 -q -L boot "${LOOP}p3" && sudo mkfs.btrfs -q -L root /dev/mapper/root
          sudo mkdir -p /mnt/target && sudo mount /dev/mapper/root /mnt/target
          sudo mkdir -p /mnt/target/boot && sudo mount "${LOOP}p3" /mnt/target/boot
          sudo mkdir -p /mnt/target/boot/efi && sudo mount "${LOOP}p2" /mnt/target/boot/efi
          BOOT_UUID=$(sudo blkid -s UUID -o value "${LOOP}p3")
          sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/target:/target -v /tmp/out:/output \
            localhost/mia-os:test-v1 \
            bootc install to-filesystem --generic-image --boot-mount-spec "UUID=$BOOT_UUID" \
            --karg "rd.luks.uuid=$LUKS_UUID" --karg "rd.luks.options=tpm2-device=auto" \
            --root-ssh-authorized-keys /output/poc.pub /target
          sudo umount -R /mnt/target && sudo cryptsetup close root && sudo losetup -d "$LOOP"
          sudo chown "$(id -u)" /tmp/out/disk.raw
      - name: Boot with Secure Boot and the TPM; the install's passphrase opens it the first time
        run: |
          cat > ~/vm.sh <<'EOS'
          vm() { ssh -i ~/.ssh/poc -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 root@localhost "$@"; }
          boot() {
            # boot secure|insecure: a fresh QEMU (and software TPM, same state) with Secure Boot on or off.
            pkill -f qemu-system-x86_64 || true; pkill -f "swtpm socket" || true; sleep 2
            mkdir -p /tmp/tpm && swtpm socket --tpm2 --tpmstate dir=/tmp/tpm --ctrl type=unixio,path=/tmp/tpm/sock -d
            if [ "$1" = secure ]; then code=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd; [ -f /tmp/vars-secure.fd ] || cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd /tmp/vars-secure.fd; vars=/tmp/vars-secure.fd
            else code=/usr/share/OVMF/OVMF_CODE_4M.fd; [ -f /tmp/vars-plain.fd ] || cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/vars-plain.fd; vars=/tmp/vars-plain.fd; fi
            qemu-system-x86_64 -enable-kvm -cpu host -m 8G -smp 4 -machine q35,smm=on \
              -global driver=cfi.pflash01,property=secure,value=on \
              -drive if=pflash,format=raw,unit=0,file=$code,readonly=on -drive if=pflash,format=raw,unit=1,file=$vars \
              -chardev socket,id=chrtpm,path=/tmp/tpm/sock -tpmdev emulator,id=tpm0,chardev=chrtpm -device tpm-tis,tpmdev=tpm0 \
              -drive file=/tmp/out/disk.raw,format=raw,if=virtio \
              -netdev user,id=n0,hostfwd=tcp::2222-:22 -device virtio-net-pci,netdev=n0 \
              -display none -chardev socket,id=ser0,path=/tmp/serial.sock,server=on,wait=off,logfile=/tmp/serial.log \
              -serial chardev:ser0 -monitor unix:/tmp/mon.sock,server,nowait -daemonize
          }
          up() { for i in $(seq 1 90); do vm true 2>/dev/null && return 0; sleep 10; done; return 1; }
          down() { vm 'systemctl poweroff' || true; for i in $(seq 1 60); do pgrep -f qemu-system-x86_64 > /dev/null || return 0; sleep 3; done; }
          EOS
          . ~/vm.sh
          chmod +x os/poc/vm/type_at_prompt.sh
          : > /tmp/serial.log
          boot secure
          SINCE=0 os/poc/vm/type_at_prompt.sh "assphrase for" install-temporary
          up
          vm 'mokutil --sb-state; cat /usr/lib/mia/POC_IMAGE_MARK; lsblk -o NAME,TYPE,FSTYPE,MOUNTPOINTS; cat /proc/cmdline'
          vm 'mokutil --sb-state' | grep -q "SecureBoot enabled"
      - name: Enrol the TPM with a PIN and make the recovery key; the temporary passphrase removed
        run: |
          . ~/vm.sh
          vm 'PASSWORD=install-temporary MIA_DISK_PIN=271828 /usr/lib/mia/os/files/mia-disk-enrol' | tee /tmp/enrol.txt
          grep -oE "([cbdefghijklnrtuv]{8}-){7}[cbdefghijklnrtuv]{8}" /tmp/enrol.txt | head -n 1 > /tmp/recovery.txt
          test -s /tmp/recovery.txt
      - name: 1. A boot asks only for the PIN, and opens with it
        run: |
          . ~/vm.sh
          down; boot secure
          SINCE=0 os/poc/vm/type_at_prompt.sh "enter .*PIN" 271828
          up
          vm 'cat /usr/lib/mia/POC_IMAGE_MARK; journalctl -b --no-pager | grep -iE "cryptsetup|tpm2" | tail -n 8'
          # Only the PIN was asked for: no passphrase prompt in this boot (the log began with this QEMU).
          ! grep -qE "(recovery key|assphrase) for" /tmp/serial.log
      - name: 2. After an update the PIN still opens it, never the recovery key
        run: |
          . ~/vm.sh
          vm 'bootc switch --transport registry 10.0.2.2:5000/mia-os:test-v2'
          pins=$(grep -c "enter .*PIN" /tmp/serial.log || true)
          vm 'systemctl reboot' || true
          SINCE=$pins os/poc/vm/type_at_prompt.sh "enter .*PIN" 271828
          up
          test "$(vm cat /usr/lib/mia/POC_IMAGE_MARK)" = v2
          # "Never the recovery key": neither a recovery-key prompt nor a passphrase one since this QEMU started,
          # across the update's restart (with no passphrase left on the disk, systemd names the recovery key).
          ! grep -qE "(recovery key|assphrase) for" /tmp/serial.log
      - name: 3. With Secure Boot off the TPM refuses, and the recovery key opens it
        run: |
          . ~/vm.sh
          down; boot insecure
          # systemd asks for the PIN before it finds the TPM won't release the key (it can't know until it tries; seen
          # in the first run); then it falls back to "Please enter recovery key for disk root".
          SINCE=0 os/poc/vm/type_at_prompt.sh "enter .*PIN" 271828 180 || echo "No PIN prompt with Secure Boot off."
          SINCE=0 os/poc/vm/type_at_prompt.sh "(recovery key|assphrase) for" "$(cat /tmp/recovery.txt)" 600
          up
          vm 'mokutil --sb-state; journalctl -b --no-pager | grep -iE "tpm2|cryptsetup" | tail -n 10'
          vm 'mokutil --sb-state' | grep -q "SecureBoot disabled"
      - name: The VM's serial log, for the record
        if: always()
        run: tail -n 120 /tmp/serial.log || true
