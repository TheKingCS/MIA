# os/poc/vm/serial-console.toml: the VM test's kernel arguments (test image only): the console on the serial line as well,
# and last, which makes it the system console: a disk prompt shows in the serial log and listens there, so the test
# knows when to type and where (FW-05).
kargs = ["console=tty0", "console=ttyS0,115200"]
