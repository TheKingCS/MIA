# os/files/boot-stays-mounted.conf: once /boot is mounted it stays mounted (FW-03's VM runs, 2026-11-18).
# A disk without an fstab entry for /boot gets it as an automount, which lets go after a while idle; ostree then
# couldn't remount it read-write at shutdown to apply a staged update, and the old version booted again.
[Automount]
TimeoutIdleSec=0
