<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- MIA's system helper (FW-06): only root may own the name; anyone may call it, and the helper checks every call
     against its own rules and polkit before doing anything. -->
<busconfig>
  <policy user="root">
    <allow own="org.mia.System1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mia.System1" send_interface="org.mia.System1"/>
    <allow send_destination="org.mia.System1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
