# MIA Homestead — Device Role: Water Heater MCU
# This file IS the setup instructions. Edit this, not code, when the
# physical setup changes (a new port, a different mounting spot, etc).
# Optional — not required for anything else in this system to work.
# Not in any tier's hardware BOM yet (docs/HARDWARE_BOM_FULL_TIERS.md).

role: water_heater_mcu
display_name: "Tank Water Heater Controller"
description: >
  Controls a relay-switched submersible aquarium heater for one cell's
  fish tank. Distinct from the CLIMATE MCU's heater, which heats
  greenhouse air, not tank water — modules/aquaponics_cell.py drives
  this one directly off the water temp probe and the actually-stocked
  species' documented range.

port_label: "PORT 6 — WATER HEATER"
mount_location: "Fully submerge the heater in Cell A's fish tank, per its own manufacturer instructions; mount the relay itself away from any water/splash."
default_cell_id: 1

controls:
  - actuator_type: water_heater
    actuator_name: tank_water_heater
    safe_default_state: "off"
    relay_channel: 1
    wiring_rationale: >
      Off by default — a submersible heater stuck on is a real fire/
      fish-boil hazard, the same category of danger as the climate
      MCU's air heater and dosing pumps stuck open. Falls back to off
      the instant the MCU loses the Pi.

setup_instructions: |
  1. Find the MCU labeled "WATER HEATER" in the parts bin (red label).
  2. Plug it into PORT 6 on the Pi expansion hub.
  3. Fully submerge the heater in Cell A's fish tank per its own
     manufacturer instructions — this relay only switches its power,
     it doesn't replace the heater's own waterproofing/safety design.
  4. Mount the relay itself somewhere dry, away from any water/splash.
  5. Power it on — MIA Homestead detects it automatically within a
     few seconds.
  6. Once detected, the system confirms pairing on its own. If it
     doesn't pair within a minute, double-check the connection.
