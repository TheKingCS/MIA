; PlatformIO project file for the Safety MCU firmware.
; src_dir = . so safety_mcu.ino stays in place rather than moving into
; a src/ subfolder — this file's only job is to make `pio run` compile
; the existing sketch as-is.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson@^6
