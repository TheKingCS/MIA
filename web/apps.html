<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Apps — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="module_browser">
  <!--
    Apps (claude, 2026-10-06, DEC-0017): every app MIA has, by life area,
    from MIA.apps() (core/web_surfaces.py). Open the ones on the web; the
    rest are reachable now by asking MIA (their Assistant tools are listed).
    Show/hide goes through the app.visibility action (confirm, undo).
    Muse owns the look.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="apps-head">
        <div><h1>Apps</h1><p class="dim">Your modules. Your world.</p></div>
        <button type="button" class="apps-search-button" id="search-button" aria-label="Find">🔍</button>
      </header>
      <div class="apps-tools" id="tools" hidden>
        <input id="find" type="search" placeholder="Find an app or something MIA can do…" aria-label="Find">
        <div class="ptabs" role="tablist" id="tabs"></div>
      </div>
      <section class="strip" id="strip" aria-label="Counts" hidden></section>
      <div id="groups"></div>
      <p class="apps-manage-link"><button type="button" class="btn btn-ghost" id="mode">Manage apps · what MIA can do in each</button></p>
      <p class="empty" id="nothing" hidden><strong>Nothing matches.</strong>Try another word, or just ask MIA.</p>
    </main>
  </div>

  <script src="mia.js"></script>
  <script src="shell.js"></script>
  <script src="apps.js"></script>
</body>
</html>
