<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MIA · Glasses</title>
  <link rel="stylesheet" href="glasses.css?v=27">
</head>
<body>
  <!--
    MIA on Display glasses (DEC-0016; Muse's composition, H-0041; Zac's
    layout, 2026-10-16). One fixed 600x600 composition, scaled to fit any
    screen; only the conversation log scrolls. Pure black: on the glasses it's see-through.
    Two moves do everything: move (next / previous) and select; every
    list ends with a Back row. Home is her orb alone; select it to talk.
  -->
  <div id="stage">
    <section id="home" aria-label="MIA">
      <div id="orb-wrap" aria-hidden="true">
        <div class="saturn back"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i></div>
        <span class="ring r1"></span><span class="ring r2"></span>
        <div id="orb"></div>
        <div class="saturn front"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i></div>
        <i class="p p1"></i><i class="p p2"></i><i class="p p3"></i>
      </div>
      <p id="caption" aria-live="polite"></p>
    </section>
    <section id="screen" hidden aria-live="polite"></section>
    <!-- Meeting MIA (core/first_boot.py): she doesn't launch, she awakens. -->
    <section id="boot" hidden aria-label="Meeting MIA">
      <div class="b-sky" aria-hidden="true">
        <div class="b-rays"></div>
        <div class="b-swarm"></div>
        <div class="b-core">
          <i class="b-halo"></i><i class="b-ticks"></i><i class="b-ring b1"></i><i class="b-ring b2"></i><i class="b-orb"></i>
        </div>
        <p class="b-name">MIA</p>
        <div class="b-wave"></div>
      </div>
      <p id="boot-line" aria-live="polite"></p>
      <p id="boot-keys"></p>
    </section>
    <p id="demo-tag" hidden>Demo · placeholder data</p>
    <!-- for a touchscreen: tap an edge to move (the glasses use the Band's scroll) -->
    <button id="prev" class="edge" type="button" aria-label="Previous">‹</button>
    <button id="next" class="edge" type="button" aria-label="Next">›</button>
  </div>
  <script src="mia.js?v=16"></script>
  <script src="icons.js?v=8"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="glasses.js?v=24"></script>
</body>
</html>
