<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MIA · Glasses</title>
  <link rel="stylesheet" href="glasses.css?v=11">
</head>
<body>
  <!--
    MIA on Display glasses (DEC-0016; Muse's composition, H-0041; Zac's
    layout, 2026-10-16). One fixed 600x600 composition, scaled to fit any
    screen, never scrolled. Pure black: on the glasses it's see-through.
    Two moves do everything: move (next / previous) and select; every
    list ends with a Back row. Home is her orb alone; select it to talk.
  -->
  <div id="stage">
    <section id="home" aria-label="MIA">
      <div id="orb-wrap" aria-hidden="true">
        <div class="saturn back"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i></div>
        <span class="ring r1"></span><span class="ring r2"></span>
        <div id="orb"></div>
        <div class="saturn front"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i></div>
        <i class="p p1"></i><i class="p p2"></i><i class="p p3"></i>
      </div>
      <p id="caption" aria-live="polite"></p>
    </section>
    <section id="screen" hidden aria-live="polite"></section>
    <p id="demo-tag" hidden>Demo · placeholder data</p>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="glasses.js?v=5"></script>
</body>
</html>
