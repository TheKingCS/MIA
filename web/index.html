<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <!--
    MIA Home (muse, 2026-10-05). Home is her presence, not a dashboard
    (Q-0004): the orb shows one ambient state — an earned celebration, the
    one due item, or quiet — the briefing is one tap away, and Talk lives
    on this same screen. Everything shown comes from Life State
    (docs/schema/life_state.schema.json); every change goes
    Propose -> visible confirmation -> Approve -> Undo (DEC-0009).
    Offline: no CDNs, no web fonts. Placeholders only (DEC-0002).
  -->

  <form class="sign-in" id="sign-in" hidden aria-label="Sign in to MIA">
    <div class="orb" aria-hidden="true"></div>
    <p>Sign in to MIA</p>
    <input id="who" autocomplete="username" placeholder="Email" required aria-label="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
    <button class="primary" type="submit">Sign in</button>
  </form>

  <main class="home" id="home" aria-live="polite">
    <section class="presence" id="presence" data-mood="quiet" aria-label="MIA">
      <div class="orb" aria-hidden="true"></div>
      <p class="presence-line" id="presence-line"></p>
      <p class="presence-sub" id="presence-sub" hidden></p>
    </section>

    <section class="focus" id="focus" hidden aria-label="One thing">
      <p class="focus-kicker" id="focus-kicker"></p>
      <h1 class="focus-title" id="focus-title"></h1>
      <p class="focus-detail" id="focus-detail"></p>
      <div class="focus-actions" id="focus-actions"></div>
    </section>

    <div class="home-actions">
      <button class="ghost" id="briefing-toggle" aria-expanded="false" aria-controls="briefing">Briefing</button>
    </div>
  </main>

  <section class="briefing-sheet" id="briefing" hidden aria-label="Briefing">
    <div class="briefing-head">
      <h2>Briefing</h2>
      <button class="ghost" id="briefing-close">Close</button>
    </div>
    <div class="briefing-body" id="briefing-body"></div>
  </section>

  <section class="talk" id="talk" aria-label="Talk with MIA">
    <div class="talk-thread" id="talk-thread" aria-live="polite"></div>
    <form class="talk-form" id="talk-form">
      <input id="talk-input" placeholder="Talk to MIA…" autocomplete="off" aria-label="Message MIA">
      <button class="primary" type="submit" id="talk-send">Send</button>
    </form>
    <p class="talk-note" id="talk-note" hidden></p>
  </section>

  <dialog id="confirm" aria-labelledby="confirm-text">
    <p id="confirm-text"></p>
    <menu>
      <button value="no" id="confirm-no">Not now</button>
      <button value="yes" class="primary" id="confirm-yes">Yes</button>
    </menu>
  </dialog>

  <p class="status" id="status" role="status"></p>

  <script src="mia.js"></script>
  <script src="home.js"></script>
</body>
</html>
