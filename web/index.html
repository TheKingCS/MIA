<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="web_home">
  <!--
    Home (DEC-0018, the mobile concept's Home; claude): MIA's greeting, the
    day's focus as a checklist (ticking proposes the item's action), the
    day's saying, quick actions into MIA Assistant, level and XP. Data:
    MIA.dashboard() + the frame's MIA.shell(). MIA's face: presence.html.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main home-main">
      <div class="home-top">
        <a class="home-brand" href="presence.html" aria-label="MIA">
          <span class="home-badge" aria-hidden="true">✦</span>
          <span><strong>MIA</strong><small>Your Life. In Sync.</small></span>
        </a>
        <a class="home-gear" href="apps.html" aria-label="Apps and settings">⚙</a>
      </div>

      <header class="hero home-hero">
        <span class="weather-chip" id="date-chip"></span>
        <h1 id="greeting">Good morning</h1>
        <p class="tagline" id="subtitle"></p>
      </header>

      <div class="home-row">
        <section class="glass glow home-focus" aria-labelledby="focus-h">
          <h2 id="focus-h">Today's Focus</h2>
          <ul class="focus-list" id="focus"></ul>
          <p class="dim" id="focus-empty" hidden>Nothing needs you today. Enjoy it.</p>
        </section>
        <section class="glass home-saying" aria-label="Today's thought">
          <p id="saying"></p>
          <span class="leaf" aria-hidden="true">🍃</span>
        </section>
      </div>

      <nav class="home-quick" id="quick" aria-label="Quick actions"></nav>

      <a class="glass home-level" id="level" href="skills.html"></a>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="shell.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
