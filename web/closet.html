<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Smart Closet — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body data-app="closet" class="mod-closet">
  <!--
    Smart Closet (claude, 2026-11-15, DEC-0162): today's outfit picks with why (weather, the day,
    what's rested), the pieces with photos, saved outfits with ratings, and what the closet says
    about itself. MIA.closet() (core/web_closet.py), actions in core/closet_actions.py.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">👕</span> <span id="hero-name">Smart Closet</span></h1>
        <p class="tagline" id="hero-tagline">Dressed for the day.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="shell.js"></script>
  <script src="closet.js"></script>
</body>
</html>
