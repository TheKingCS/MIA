<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Workshop — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="workshop" class="mod-workshop">
  <!--
    Workshop (claude, 2026-10-16): jobs, materials, products, parts and the shop's money from MIA.workshop() (core/web_more.py). Every change is an action (core/more_actions.py): add/edit/delete, stock up/down, a job's materials used and products made, a sale (takes it out of stock), a cost.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🔩</span> <span id="hero-name">Workshop</span></h1>
        <p class="tagline" id="hero-tagline">Parts, jobs and products.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="shell.js"></script>
  <script src="workshop.js"></script>
</body>
</html>
