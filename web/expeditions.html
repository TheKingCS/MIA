<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Expeditions — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="expeditions" class="mod-expeditions">
  <!--
    Expeditions (claude, 2026-10-16): your expeditions from MIA.expeditions() (core/web_more.py), happening now first, then coming up, then past; each opens to its trips with their packing list. Actions: expedition.*, trip.*, trip.status, gear.*.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🏕</span> <span id="hero-name">Expeditions</span></h1>
        <p class="tagline" id="hero-tagline">Plan the trip.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="shell.js"></script>
  <script src="expeditions.js"></script>
</body>
</html>
