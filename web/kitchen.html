<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Kitchen — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="mod-kitchen">
  <!--
    Kitchen (muse, 2026-10-05). Pantry, expiring food, the grocery
    list, recipes, and recent meals from Life State's kitchen section
    (core/kitchen_manager.py). The grocery list renders its checked
    state honestly; checking items off happens where the engine owns
    the list — this screen never invents the action.
    Offline: no CDNs, no web fonts. Placeholders only (DEC-0002).
  -->
  <form class="sign-in" id="sign-in" hidden aria-label="Sign in to MIA">
    <p>Sign in to MIA</p>
    <input id="who" autocomplete="username" placeholder="Email" required aria-label="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
    <button class="btn btn-amber" type="submit">Sign in</button>
  </form>

  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Modules">
      <a class="brand" href="index.html">🌿 MIA<small>Your Life. In Sync.</small></a>
      <a class="nav" href="index.html"><span class="ico" aria-hidden="true">⌂</span>Home</a>
      <a class="nav" href="missions.html"><span class="ico" aria-hidden="true">◎</span>Missions</a>
      <a class="nav" href="skills.html"><span class="ico" aria-hidden="true">★</span>Skills</a>
      <a class="nav" href="finances.html"><span class="ico" aria-hidden="true">💰</span>Finances</a>
      <a class="nav" href="real-estate.html"><span class="ico" aria-hidden="true">🏠</span>Real Estate</a>
      <a class="nav" href="garage.html"><span class="ico" aria-hidden="true">🔧</span>Garage</a>
      <a class="nav" href="kitchen.html" aria-current="page"><span class="ico" aria-hidden="true">🍳</span>Kitchen</a>
      <a class="nav" href="workout.html"><span class="ico" aria-hidden="true">💪</span>Workout</a>
      <div class="side-foot">More modules arrive as they ship.</div>
    </nav>

    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true">🍳</span> Kitchen</h1>
        <p class="tagline">Good food. More energy.</p>
      </header>

      <section class="strip" id="strip" aria-label="Kitchen status"></section>

      <div class="sect"><h2>Use it up</h2><span class="stag" id="exp-stag"></span></div>
      <div class="rows" id="expiring"></div>

      <div class="sect"><h2>Grocery list</h2></div>
      <div class="rows" id="grocery"></div>

      <div class="sect"><h2>Recent meals</h2></div>
      <div class="rows" id="meals"></div>

      <p class="status-line" id="status" role="status" style="margin-top: calc(var(--gap) * 1.5);"></p>
    </main>
  </div>

  <script src="mia.js"></script>
  <script src="kitchen.js"></script>
</body>
</html>
