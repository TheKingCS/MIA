<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Kitchen — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="kitchen" class="mod-kitchen">
  <!--
    Kitchen (claude, 2026-10-06, DEC-0017/0018): recipes, the pantry, the
    grocery list, the meal log and what you can make, from MIA.kitchen()
    (core/web_screens.py). Every change is a kitchen action through
    MIAShell.act (core/kitchen_actions.py). Replaces the 2026-10-05
    summary-only screen.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🍳</span> <span id="hero-name">Kitchen</span></h1>
        <p class="tagline" id="hero-tagline">Good food. Good mood.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="shell.js"></script>
  <script src="kitchen.js"></script>
</body>
</html>
