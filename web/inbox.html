<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Inbox — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="inbox" class="mod-inbox">
  <!--
    Inbox (claude, 2026-10-16; Zac: "build the inbox for sending stuff to
    MIA"). Send a photo, a file or a note (or share from any app: MIA is in
    the phone's Share menu); MIA reads each one (core/inbox_manager.py) and
    proposes where it goes: a receipt into Money, a manual onto the tool's
    page with its maintenance steps. Nothing is filed until you say so.
    Data: MIA.inbox() (core/web_inbox.py); actions: core/inbox_actions.py.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">📥</span> <span id="hero-name">Inbox</span></h1>
        <p class="tagline" id="hero-tagline">Send it to MIA.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="shell.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
