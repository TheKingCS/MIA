<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Property — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body data-app="property" data-scope="property" class="mod-garage">
  <!--
    Property (claude, 2026-10-06, DEC-0017): one of the equipment screens
    (equipment.js), from MIA.equipment("property") (core/web_equipment.py).
    Every change is an equipment action through MIAShell.act. Muse owns the look.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon"></span> <span id="hero-name">Property</span></h1>
        <p class="tagline" id="hero-tagline"></p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="shell.js"></script>
  <script src="equipment.js"></script>
</body>
</html>
