<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Compliance — MIA</title>
  <link rel="stylesheet" href="tokens.css">

<body data-app="compliance" class="mod-compliance">
  <!--
    Compliance (claude, 2026-10-21, DEC-0040; the Business OS spec's first
    increment): tax filings and payments, permits, licences, registrations and
    renewals: Overdue, Next 30 days, Later, To check, Done. Each with when it's
    really due, the fee, documents, the next step, the official link, and
    whether it's verified. MIA.compliance() (core/web_compliance.py); actions
    in core/obligation_actions.py. MIA never files, pays or signs anything.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">📋</span> <span id="hero-name">Compliance</span></h1>
        <p class="tagline" id="hero-tagline">Every deadline, on time.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="shell.js"></script>
  <script src="compliance.js"></script>
</body>
</html>
