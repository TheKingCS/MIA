<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Real Estate — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">
</head>
<body data-app="real_estate" class="mod-real-estate">
  <!--
    Real Estate (claude, 2026-10-06, DEC-0017/0018): properties with
    status, rent, balance and equity, each one's upkeep (its Maintenance
    asset) and related missions, from MIA.realEstate()
    (core/web_screens.py). Rent and expenses land in Money. Every change
    is a property action through MIAShell.act (core/estate_actions.py).
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🏘</span> <span id="hero-name">Real Estate</span></h1>
        <p class="tagline" id="hero-tagline">Cash flow. Equity. Freedom.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="shell.js"></script>
  <script src="real-estate.js"></script>
</body>
</html>
