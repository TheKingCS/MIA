<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Real Estate — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="mod-estate">
  <!--
    Real Estate (muse, 2026-10-05). The portfolio from Life State's
    properties section (core/real_estate_manager.py): every property's
    value, mortgage, and equity, plus portfolio totals. Read-only and
    honest — no invented valuations, no fake "for sale" tags.
    Offline: no CDNs, no web fonts. Placeholders only (DEC-0002).
  -->
  <form class="sign-in" id="sign-in" hidden aria-label="Sign in to MIA">
    <p>Sign in to MIA</p>
    <input id="who" autocomplete="username" placeholder="Email" required aria-label="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required aria-label="Password">
    <button class="btn btn-amber" type="submit">Sign in</button>
  </form>

  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Modules">
      <a class="brand" href="index.html">🌿 MIA<small>Your Life. In Sync.</small></a>
      <a class="nav" href="index.html"><span class="ico" aria-hidden="true">⌂</span>Home</a>
      <a class="nav" href="missions.html"><span class="ico" aria-hidden="true">◎</span>Missions</a>
      <a class="nav" href="skills.html"><span class="ico" aria-hidden="true">★</span>Skills</a>
      <a class="nav" href="finances.html"><span class="ico" aria-hidden="true">💰</span>Finances</a>
      <a class="nav" href="real-estate.html" aria-current="page"><span class="ico" aria-hidden="true">🏠</span>Real Estate</a>
      <a class="nav" href="garage.html"><span class="ico" aria-hidden="true">🔧</span>Garage</a>
      <a class="nav" href="kitchen.html"><span class="ico" aria-hidden="true">🍳</span>Kitchen</a>
      <a class="nav" href="workout.html"><span class="ico" aria-hidden="true">💪</span>Workout</a>
      <div class="side-foot">More modules arrive as they ship.</div>
    </nav>

    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true">🏠</span> Real Estate</h1>
        <p class="tagline">Manage properties. Grow wealth.</p>
      </header>

      <section class="strip" id="strip" aria-label="Portfolio status"></section>

      <div class="sect"><h2>Portfolio</h2><span class="stag" id="pf-stag"></span></div>
      <section class="glass glow" id="totals" aria-label="Portfolio totals"></section>

      <div class="sect"><h2>Properties</h2></div>
      <div class="rows" id="props"></div>

      <p class="status-line" id="status" role="status" style="margin-top: calc(var(--gap) * 1.5);"></p>
    </main>
  </div>

  <script src="mia.js"></script>
  <script src="real-estate.js"></script>
</body>
</html>
