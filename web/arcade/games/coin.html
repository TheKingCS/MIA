<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Coin Flip · Lens Arcade</title>
<script src="../progress.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#000;color:#f4ead0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;}
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:18px 30px;row-gap:10px;}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #coin-zone{display:grid;place-items:center;perspective:600px;width:100%;}
  #coin{width:min(52vw,52vh,260px);height:min(52vw,52vh,260px);position:relative;cursor:pointer;
    transform-style:preserve-3d;}
  #coin.flip{animation:flip 1.1s cubic-bezier(.3,.7,.4,1);}
  @keyframes flip{
    0%{transform:rotateY(0) translateY(0);}
    35%{transform:rotateY(540deg) translateY(-46px);}
    70%{transform:rotateY(1080deg) translateY(0);}
    100%{transform:rotateY(1440deg) translateY(0);}
  }
  .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;
    background:radial-gradient(circle at 35% 28%, #ffe9ad 0%, #f6c453 45%, #8a5f08 100%);
    border:3px solid rgba(255,237,184,.7);
    box-shadow:0 0 50px rgba(246,196,83,.35), inset 0 0 30px rgba(120,80,10,.5);
    font-size:min(11vw,11vh,56px);font-weight:800;color:#3a2a05;}
  .face.back{transform:rotateY(180deg);}
  #result{font-size:26px;font-weight:800;letter-spacing:.24em;color:#ffedb8;min-height:36px;
    text-shadow:0 0 22px rgba(246,196,83,.65);}
  #streak{font-size:13px;color:rgba(244,234,208,.5);letter-spacing:.08em;min-height:20px;text-align:center;}
  #hint{font-size:12.5px;color:rgba(244,234,208,.35);}
  @media (prefers-reduced-motion:reduce){#coin.flip{animation:none;}}
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <div id="coin-zone">
    <div id="coin" role="button" tabindex="0" aria-label="Flip the coin">
      <div class="face front">H</div>
      <div class="face back">T</div>
    </div>
  </div>
  <div style="display:grid;justify-items:center;gap:8px;">
    <p id="result"></p>
    <p id="streak"></p>
    <p id="hint">tap the coin to flip</p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var coin=document.getElementById("coin"),result=document.getElementById("result"),
      streakEl=document.getElementById("streak"),busy=false;
  var store="laCoin.v1",s={flips:0,heads:0,streak:0,last:null};
  try{var raw=localStorage.getItem(store);if(raw)s=JSON.parse(raw);}catch(e){}
  function save(){try{localStorage.setItem(store,JSON.stringify(s));}catch(e){}}
  function paint(){
    streakEl.textContent=s.flips===0?"no flips yet":
      s.heads+" heads · "+(s.flips-s.heads)+" tails"+(s.streak>1?" · 🔥 "+s.streak+" in a row":"");
  }
  function flip(){
    if(busy)return;busy=true;result.textContent="";
    coin.classList.remove("flip");void coin.offsetWidth;coin.classList.add("flip");
    var heads=Math.random()<0.5;
    setTimeout(function(){
      coin.style.transform="rotateY("+(heads?0:180)+"deg)";
      result.textContent=heads?"HEADS":"TAILS";
      s.flips++;if(heads)s.heads++;
      var key=heads?"H":"T";
      s.streak=(s.last===key)?s.streak+1:1;s.last=key;
      save();paint();
      if(window.ArcadeProgress){
        ArcadeProgress.award("coin","flip",3);
        if(s.streak===5)ArcadeProgress.award("coin","streak5",25);
      }
      busy=false;
      setTimeout(function(){coin.style.transform="";},900);
    },1050);
  }
  coin.addEventListener("click",flip);
  coin.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
  paint();
})();
</script>
</body>
</html>
