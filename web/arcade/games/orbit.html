<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Orbit · Lens Arcade</title>
<script src="../progress.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#000;color:#f4ead0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;}
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:flex;flex-direction:column;align-items:center;padding:16px 28px;gap:8px;overflow-y:auto;}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;flex:none;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #bank{text-align:center;flex:none;}
  #bank-num{font-size:40px;font-weight:800;color:#ffedb8;text-shadow:0 0 26px rgba(246,196,83,.55);line-height:1;}
  #bank-rate{font-size:13px;color:rgba(244,234,208,.55);letter-spacing:.1em;margin-top:4px;}
  #station-zone{position:relative;display:grid;place-items:center;width:100%;height:158px;flex:none;}
  #station{
    width:min(30vw,140px);height:min(30vw,140px);border-radius:50%;cursor:pointer;position:relative;z-index:2;
    background:radial-gradient(circle at 38% 30%, #fffdf4 0%, #ffedb8 18%, #f6c453 48%, #7a5208 82%, #241a03 100%);
    box-shadow:0 0 50px rgba(246,196,83,.6), inset 0 0 24px rgba(255,250,225,.5);
    transition:transform .08s ease;
  }
  #station:active{transform:scale(.94);}
  #station .tap{position:absolute;font-weight:800;color:#ffedb8;pointer-events:none;
    text-shadow:0 0 12px rgba(246,196,83,.9);animation:float .8s ease-out forwards;font-size:20px;}
  @keyframes float{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-46px);}}
  .sat{position:absolute;width:7px;height:7px;border-radius:50%;background:#5fd6c8;
    box-shadow:0 0 10px 2px rgba(95,214,200,.7);z-index:1;}
  #gens{width:100%;display:grid;gap:8px;flex:none;}
  .gen{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
    border:1px solid rgba(246,196,83,.22);border-radius:14px;padding:9px 14px;background:rgba(255,248,230,.03);}
  .gen .nm{font-size:15px;font-weight:700;}
  .gen .nm small{color:rgba(244,234,208,.5);font-weight:400;}
  .gen .sub{font-size:12px;color:rgba(244,234,208,.5);grid-column:1;}
  .buy{cursor:pointer;border:1px solid rgba(246,196,83,.5);background:rgba(246,196,83,.1);color:#ffedb8;
    border-radius:99px;padding:9px 16px;font-size:14px;font-weight:700;white-space:nowrap;}
  .buy.afford{background:#f6c453;color:#241a03;box-shadow:0 0 14px rgba(246,196,83,.45);}
  .buy:active{transform:scale(.95);}
  #foot{font-size:11.5px;color:rgba(244,234,208,.35);letter-spacing:.06em;text-align:center;line-height:1.7;flex:none;padding-bottom:4px;}
  .seclabel{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.5);font-weight:700;flex:none;margin:6px 0 0;}
  #ups{width:100%;display:grid;gap:8px;flex:none;}
  .up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
    border:1px solid rgba(95,214,200,.3);border-radius:14px;padding:9px 14px;background:rgba(95,214,200,.04);}
  .up .nm{font-size:14.5px;font-weight:700;color:#d8fff9;}
  .up .sub{font-size:12px;color:rgba(244,234,208,.5);grid-column:1;}
  .up.owned{opacity:.45;}
  .up.owned .buy{visibility:hidden;}
  #comet{position:absolute;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:3;
    background:radial-gradient(circle at 40% 35%, #e8fffb 0%, #5fd6c8 50%, #1d5a54 100%);
    box-shadow:0 0 26px 6px rgba(95,214,200,.75);
    animation:cometPulse 1s ease-in-out infinite;}
  @keyframes cometPulse{50%{transform:scale(1.18);}}
  @media (prefers-reduced-motion:reduce){#comet{animation:none;}}
  #welcome{font-size:13px;color:#5fd6c8;min-height:18px;text-align:center;}
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <div id="bank">
    <p id="bank-num">0</p>
    <p id="bank-rate">⚡0/s</p>
    <p id="welcome"></p>
  </div>
  <div id="station-zone"><div id="station" role="button" tabindex="0" aria-label="Tap to generate energy"></div></div>
  <div id="gens"></div>
  <p class="seclabel">UPGRADES</p>
  <div id="ups"></div>
  <p id="foot"></p>
</div>
<script>
(function(){
  "use strict";
  var STORE="laOrbit.v1", CAP=8*3600*1000, OFFRATE=0.5;
  var DEFS=[
    {id:"solar", name:"Solar Array", rate:1,   base:25},
    {id:"fusion",name:"Fusion Cell", rate:6,   base:160},
    {id:"ring",  name:"Orbital Ring",rate:25,  base:1400},
    {id:"dyson", name:"Dyson Swarm", rate:120, base:12000}
  ];
  var s={bank:0,total:0,taps:0,gens:{},mult:{},tapPow:1,ups:{},comets:0,last:Date.now()};
  try{var raw=localStorage.getItem(STORE);if(raw){var p=JSON.parse(raw);for(var k in s)if(p[k]!==undefined)s[k]=p[k];}}catch(e){}
  function save(){s.last=Date.now();try{localStorage.setItem(STORE,JSON.stringify(s));}catch(e){}}
  function cost(d){var n=s.gens[d.id]||0;return Math.ceil(d.base*Math.pow(1.6,n));}
  function rate(){var r=0;DEFS.forEach(function(d){r+=d.rate*(s.gens[d.id]||0)*(s.mult[d.id]||1);});return r;}
  function fmt(n){
    if(n>=1e6)return (n/1e6).toFixed(2)+"M";
    if(n>=1e3)return (n/1e3).toFixed(1)+"k";
    return Math.floor(n).toString();
  }
  // offline progress
  var away=Date.now()-(s.last||Date.now());
  if(away>60000){
    var eff=Math.min(away,CAP), gain=rate()*eff/1000*OFFRATE;
    if(gain>=1){
      s.bank+=gain;s.total+=gain;
      document.getElementById("welcome").textContent="Welcome back: +"+fmt(gain)+" ⚡";
    }
  }
  var bankNum=document.getElementById("bank-num"),bankRate=document.getElementById("bank-rate"),
      gensEl=document.getElementById("gens"),foot=document.getElementById("foot"),
      zone=document.getElementById("station-zone"),station=document.getElementById("station");
  // rolling tap log: effective per-second includes click points
  var tapLog=[];
  // tap power is additive: owned tap upgrades stack (5 + 25 = 30)
  function tapPower(){
    var p=(s.ups.u_tap1?5:0)+(s.ups.u_tap2?25:0);
    return p>0?p:(s.tapPow>1?s.tapPow:1);
  }
  function effRate(){
    var now=Date.now();
    while(tapLog.length&&now-tapLog[0]>5000)tapLog.shift();
    return rate()+(tapLog.length/5)*tapPower();
  }
  // tap the station
  function tap(x,y){
    var v=tapPower();
    s.bank+=v;s.total+=v;s.taps++;
    tapLog.push(Date.now());
    var f=document.createElement("span");f.className="tap";f.textContent="+"+v;
    var r=station.getBoundingClientRect(),zr=zone.getBoundingClientRect();
    f.style.left=((x!==undefined?x:r.left+r.width/2)-zr.left-8)+"px";
    f.style.top=((y!==undefined?y:r.top+r.height/2)-zr.top-14)+"px";
    zone.appendChild(f);setTimeout(function(){f.remove();},800);
    paint();
  }
  station.addEventListener("click",function(e){tap(e.clientX,e.clientY);});
  station.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tap();}});
  // generator rows
  var buyBtns={};
  DEFS.forEach(function(d){
    var row=document.createElement("div");row.className="gen";
    row.innerHTML='<div class="nm">'+d.name+' <small>×<span class="cnt">0</span></small></div>'+
      '<div class="sub">+'+d.rate+' ⚡/s each</div>';
    var b=document.createElement("button");b.type="button";b.className="buy";
    b.setAttribute("aria-label","Buy "+d.name);
    b.onclick=function(){
      var c=cost(d);if(s.bank<c)return;
      s.bank-=c;s.gens[d.id]=(s.gens[d.id]||0)+1;
      if(window.ArcadeProgress)ArcadeProgress.award("orbit","buy",20);
      paint();drawSats();
    };
    row.appendChild(b);gensEl.appendChild(row);buyBtns[d.id]=b;
  });
  // orbiting satellites = total generators (capped visually)
  var sats=[];
  function drawSats(){
    sats.forEach(function(el){el.remove();});sats=[];
    var total=DEFS.reduce(function(a,d){return a+(s.gens[d.id]||0);},0);
    var n=Math.min(total,18),R=42;
    for(var i=0;i<n;i++){
      (function(i){
        var el=document.createElement("i");el.className="sat";zone.appendChild(el);sats.push(el);
        var a0=i/n*Math.PI*2;
        function orbit(){
          var t=Date.now()/1000*(0.5+ (i%3)*0.12)+a0;
          var zr=zone.getBoundingClientRect(),sr=station.getBoundingClientRect();
          var cx=sr.left+zr.width/2-zr.left, cy=sr.top+zr.height/2-zr.top;
          // scale radius to station size
          var rad=sr.width/2+26;
          el.style.left=(zr.width/2+Math.cos(t)*rad-3)+"px";
          el.style.top=(sr.top-zr.top+sr.height/2+Math.sin(t)*rad*0.62-3)+"px";
          requestAnimationFrame(orbit);
        }
        orbit();
      })(i);
    }
  }
  // one-time milestone: lifetime total energy crosses 10,000
  function check10k(){
    if(!s.milestone10k&&s.total>=10000){
      s.milestone10k=true;save();
      if(window.ArcadeProgress)ArcadeProgress.award("orbit","10k",100);
    }
  }
  // ---- upgrades shop (Cookie Clicker style) ----
  var UPS=[
    {id:"u_solar", name:"Twin Solar Cells", desc:"Solar Arrays ×2", cost:600,   fx:function(){s.mult.solar=2;}},
    {id:"u_fusion",name:"Hot Fusion",       desc:"Fusion Cells ×2", cost:4000,  fx:function(){s.mult.fusion=2;}},
    {id:"u_ring",  name:"Ring Resonance",   desc:"Orbital Rings ×2",cost:30000, fx:function(){s.mult.ring=2;}},
    {id:"u_dyson", name:"Swarm Intelligence",desc:"Dyson Swarms ×2",cost:250000,fx:function(){s.mult.dyson=2;}},
    {id:"u_tap1",  name:"Reinforced Tap",   desc:"Taps give +5 · stacks",    cost:1200,  fx:function(){}},
    {id:"u_tap2",  name:"Quantum Tap",      desc:"Taps give +25 · stacks",   cost:30000, fx:function(){}},
  ];
  var upsEl=document.getElementById("ups"),upBtns={};
  UPS.forEach(function(u){
    var row=document.createElement("div");row.className="up";row.id="up-"+u.id;
    row.innerHTML='<div class="nm">'+u.name+'</div><div class="sub">'+u.desc+'</div>';
    var b=document.createElement("button");b.type="button";b.className="buy";
    b.setAttribute("aria-label","Buy "+u.name);
    b.onclick=function(){
      if(s.ups[u.id]||s.bank<u.cost)return;
      s.bank-=u.cost;s.ups[u.id]=true;u.fx();save();
      if(window.ArcadeProgress)ArcadeProgress.award("orbit","upgrade",30);
      paint();
    };
    row.appendChild(b);upsEl.appendChild(row);upBtns[u.id]=b;
  });
  // ---- comets (golden-cookie style bonus events) ----
  var cometEl=null,cometTimer=null;
  function scheduleComet(){
    clearTimeout(cometTimer);
    cometTimer=setTimeout(spawnComet,90000+Math.random()*90000); // every 1.5–3 min
  }
  function spawnComet(){
    if(document.hidden||cometEl){scheduleComet();return;}
    var zr=zone.getBoundingClientRect();
    cometEl=document.createElement("div");cometEl.id="comet";
    cometEl.setAttribute("role","button");cometEl.setAttribute("aria-label","Catch the comet");
    cometEl.style.left=(20+Math.random()*Math.max(40,zr.width-80))+"px";
    cometEl.style.top=(10+Math.random()*Math.max(30,zr.height-60))+"px";
    cometEl.onclick=catchComet;
    zone.appendChild(cometEl);
    setTimeout(function(){ // it streaks away after 12s
      if(cometEl){cometEl.remove();cometEl=null;scheduleComet();}
    },12000);
  }
  function catchComet(){
    if(!cometEl)return;
    var bonus=Math.max(50,Math.floor(Math.max(s.bank*0.15,rate()*60)));
    s.bank+=bonus;s.total+=bonus;s.comets++;
    if(window.ArcadeProgress)ArcadeProgress.award("orbit","comet",20);
    document.getElementById("welcome").textContent="☄️ Comet caught: +"+fmt(bonus)+" ⚡";
    cometEl.remove();cometEl=null;save();paint();scheduleComet();
  }
  function paint(){
    check10k();
    bankNum.textContent=fmt(s.bank);
    bankRate.textContent="⚡"+fmt(effRate())+"/s";
    DEFS.forEach(function(d){
      var n=s.gens[d.id]||0,c=cost(d),b=buyBtns[d.id],m=s.mult[d.id]||1;
      b.parentElement.querySelector(".cnt").textContent=n;
      b.parentElement.querySelector(".sub").textContent=
        "+"+fmt(d.rate*m)+" ⚡/s each"+(m>1?" (×"+m+")":"");
      b.textContent="Buy "+fmt(c)+" ⚡";
      b.classList.toggle("afford",s.bank>=c);
    });
    UPS.forEach(function(u){
      var owned=!!s.ups[u.id],b=upBtns[u.id];
      b.parentElement.classList.toggle("owned",owned);
      if(!owned){b.textContent="Buy "+fmt(u.cost)+" ⚡";b.classList.toggle("afford",s.bank>=u.cost);}
    });
    foot.innerHTML="Total earned: "+fmt(s.total)+" ⚡ · Station taps: "+s.taps+" · Comets: "+s.comets+" · v3";
  }
  // tick
  setInterval(function(){var r=rate();if(r>0){s.bank+=r/10;s.total+=r/10;paint();}},100);
  setInterval(save,5000);
  window.addEventListener("beforeunload",save);
  document.addEventListener("visibilitychange",function(){if(document.hidden)save();});
  paint();drawSats();scheduleComet();
})();
</script>
</body>
</html>
