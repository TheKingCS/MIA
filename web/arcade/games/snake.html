<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Snake · Lens Arcade</title>
<script src="../progress.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#000;color:#f4ead0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    user-select:none;-webkit-user-select:none;}
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;padding:16px 30px 14px;row-gap:8px;}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #scorebar{width:100%;display:flex;justify-content:space-between;font-size:13px;
    letter-spacing:.14em;color:rgba(244,234,208,.6);text-transform:uppercase;}
  #scorebar b{color:#ffedb8;font-size:17px;}
  #wrap{position:relative;width:min(78vw,58vh,430px);aspect-ratio:1/1;}
  canvas{width:100%;height:100%;display:block;border:1px solid rgba(246,196,83,.3);
    border-radius:14px;background:#000;touch-action:none;
    box-shadow:0 0 30px rgba(246,196,83,.1), inset 0 0 40px rgba(246,196,83,.03);}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;
    background:rgba(0,0,0,.72);border-radius:14px;text-align:center;padding:20px;}
  #overlay[hidden]{display:none;}
  #ov-title{font-size:30px;font-weight:800;color:#ffedb8;text-shadow:0 0 24px rgba(246,196,83,.6);}
  #ov-sub{font-size:15px;color:rgba(244,234,208,.75);line-height:1.6;}
  #ov-best{font-size:12.5px;letter-spacing:.2em;color:rgba(244,234,208,.45);text-transform:uppercase;}
  #dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:6px;}
  #dpad button{cursor:pointer;border:1px solid rgba(246,196,83,.4);border-radius:12px;
    background:rgba(255,248,230,.05);color:#f6c453;font-size:22px;touch-action:manipulation;}
  #dpad button:active{background:rgba(246,196,83,.25);}
  #d-up{grid-column:2;grid-row:1;} #d-left{grid-column:1;grid-row:2;}
  #d-right{grid-column:3;grid-row:2;} #d-down{grid-column:2;grid-row:3;}
  @media (prefers-reduced-motion:reduce){}
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <div id="scorebar"><span>score <b id="score">0</b></span><span>best <b id="best">0</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="340" height="340" aria-label="Snake game"></canvas>
    <div id="overlay" hidden>
      <p id="ov-title">SNAKE</p>
      <p id="ov-sub"></p>
      <p id="ov-best"></p>
    </div>
  </div>
  <div id="dpad" aria-label="Direction pad">
    <button id="d-up" type="button" aria-label="Up">▲</button>
    <button id="d-left" type="button" aria-label="Left">◀</button>
    <button id="d-right" type="button" aria-label="Right">▶</button>
    <button id="d-down" type="button" aria-label="Down">▼</button>
  </div>
</div>
<script>
(function(){
  "use strict";
  var N=17, cv=document.getElementById("cv"), ctx=cv.getContext("2d"),
      cell=cv.width/N,
      scoreEl=document.getElementById("score"), bestEl=document.getElementById("best"),
      overlay=document.getElementById("overlay"),
      ovTitle=document.getElementById("ov-title"), ovSub=document.getElementById("ov-sub"),
      ovBest=document.getElementById("ov-best");
  var BESTKEY="laSnakeBest", best=parseInt(localStorage.getItem(BESTKEY)||"0",10)||0;
  var snake, dir, pending, food, score, speed, acc, last, running, dead;

  function show(title, sub){
    ovTitle.textContent=title; ovSub.innerHTML=sub;
    ovBest.textContent="best · "+best;
    overlay.hidden=false;
  }
  function hide(){ overlay.hidden=true; }

  function placeFood(){
    while(true){
      var f={x:(Math.random()*N)|0, y:(Math.random()*N)|0}, ok=true;
      for(var i=0;i<snake.length;i++) if(snake[i].x===f.x&&snake[i].y===f.y){ok=false;break;}
      if(ok){food=f;return;}
    }
  }
  function reset(){
    snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir={x:1,y:0}; pending=null; score=0; speed=7; acc=0;
    scoreEl.textContent="0"; placeFood(); dead=false; running=true;
    last=performance.now(); hide();
  }
  function setDir(x,y){
    if(dead||!running) return;
    if(snake.length>1 && dir.x===-x && dir.y===-y) return; // no reversing
    if(dir.x===x&&dir.y===y) return;
    pending={x:x,y:y};
  }
  function step(){
    if(pending){dir=pending;pending=null;}
    var h={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N) return die();
    for(var i=0;i<snake.length-1;i++) if(snake[i].x===h.x&&snake[i].y===h.y) return die();
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      score++; scoreEl.textContent=score;
      speed=Math.min(speed*1.04, 16);
      if(score>best){best=score;bestEl.textContent=best;
        try{localStorage.setItem(BESTKEY,String(best));}catch(e){}}
      placeFood();
    } else snake.pop();
  }
  function die(){
    dead=true; running=false;
    if(window.ArcadeProgress){
      ArcadeProgress.award("snake","played",10);
      if(score>=best&&score>0)ArcadeProgress.award("snake","newbest",50);
    }
    show("GAME OVER",
      "you ate <b style='color:#ffedb8'>"+score+"</b>"+
      (score>=best&&score>0?" — new best!":""));
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // food: teal glow dot
    var fx=food.x*cell+cell/2, fy=food.y*cell+cell/2;
    var g=ctx.createRadialGradient(fx,fy,1,fx,fy,cell*0.9);
    g.addColorStop(0,"#bffcf4"); g.addColorStop(0.4,"#5fd6c8"); g.addColorStop(1,"rgba(95,214,200,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx,fy,cell*0.9,0,7); ctx.fill();
    // snake: gold body, bright head
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i], px=s.x*cell, py=s.y*cell, pad=cell*0.12;
      if(i===0){
        ctx.fillStyle="#ffedb8";
        ctx.shadowColor="rgba(246,196,83,.9)"; ctx.shadowBlur=14;
      } else {
        var t=i/snake.length;
        ctx.fillStyle="rgb("+Math.round(246-t*90)+","+Math.round(196-t*80)+","+Math.round(83-t*40)+")";
        ctx.shadowColor="rgba(246,196,83,.35)"; ctx.shadowBlur=6;
      }
      ctx.beginPath();
      ctx.roundRect(px+pad,py+pad,cell-pad*2,cell-pad*2,cell*0.28);
      ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  function loop(now){
    if(running&&!dead){
      var dt=(now-last)/1000; last=now; acc+=dt;
      var stepT=1/speed;
      while(acc>=stepT){ acc-=stepT; step(); if(dead) break; }
      draw();
    }
    requestAnimationFrame(loop);
  }
  // D-pad
  function bind(id,x,y){document.getElementById(id).addEventListener("click",function(){setDir(x,y);});}
  bind("d-up",0,-1); bind("d-down",0,1); bind("d-left",-1,0); bind("d-right",1,0);
  // swipe
  var sx=0, sy=0;
  cv.addEventListener("touchstart",function(e){e.preventDefault();
    var t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY;},{passive:false});
  cv.addEventListener("touchend",function(e){e.preventDefault();
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
  },{passive:false});
  // keyboard for desktop testing
  document.addEventListener("keydown",function(e){
    var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
           w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
    if(m[e.key]){e.preventDefault();setDir(m[e.key][0],m[e.key][1]);}
  });
  // tap overlay to (re)start
  overlay.addEventListener("click",function(){ if(!running) reset(); });
  // pause when hidden so the snake doesn't die in the background
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ running=false; }
    else if(!dead){ running=true; last=performance.now(); }
  });
  bestEl.textContent=best;
  show("SNAKE","eat the teal dots · don't hit the walls<br>tap to start");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
