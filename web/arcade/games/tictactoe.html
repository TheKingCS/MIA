<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tic-Tac-Toe · Lens Arcade</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#000;color:#f4ead0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  #stage{
    width:min(100vw,100vh);height:min(100vw,100vh);
    max-width:600px;max-height:600px;position:relative;
    display:flex;flex-direction:column;align-items:center;
    padding:14px 26px 16px;gap:10px;
  }
  header{width:100%;display:flex;align-items:center;justify-content:space-between;}
  header a{color:#f6c453;text-decoration:none;font-size:14px;letter-spacing:.08em;font-weight:600;}
  header a:active{opacity:.6;}
  .wordmark{font-size:11px;letter-spacing:.42em;color:rgba(246,196,83,.55);font-weight:600;}
  .seg{display:flex;gap:8px;}
  .seg button{
    touch-action:manipulation;cursor:pointer;
    background:rgba(246,196,83,.05);border:1px solid rgba(246,196,83,.3);
    color:rgba(244,234,208,.65);border-radius:99px;padding:7px 18px;
    font-size:13px;letter-spacing:.1em;font-weight:600;
  }
  .seg button.on{
    background:rgba(246,196,83,.16);border-color:#f6c453;color:#ffedb8;
    box-shadow:0 0 14px rgba(246,196,83,.25);
  }
  #status{
    min-height:30px;font-size:19px;letter-spacing:.18em;font-weight:700;color:#ffedb8;
    text-transform:uppercase;text-align:center;
  }
  #status.thinking{color:rgba(244,234,208,.5);font-size:14px;letter-spacing:.24em;}
  #status.win{color:#f6c453;text-shadow:0 0 20px rgba(246,196,83,.85);animation:pulse 1.1s ease-in-out infinite;}
  #status.lose{color:#b48cf2;text-shadow:0 0 20px rgba(180,140,242,.85);}
  #status.draw{color:#f4ead0;text-shadow:0 0 16px rgba(244,234,208,.5);}
  @keyframes pulse{50%{opacity:.65;}}
  #boardwrap{position:relative;width:min(74vw,74vh,330px);}
  #board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;aspect-ratio:1;
  }
  .cell{
    touch-action:manipulation;cursor:pointer;user-select:none;
    background:rgba(246,196,83,.045);border:1px solid rgba(246,196,83,.35);
    border-radius:16px;display:grid;place-items:center;
    font-size:clamp(40px,11vw,64px);font-weight:700;line-height:1;
    transition:background .15s,transform .1s;
  }
  .cell:active{transform:scale(.95);}
  .cell.filled{cursor:default;}
  .cell.filled:active{transform:none;}
  .cell.x{color:#f6c453;text-shadow:0 0 26px rgba(246,196,83,.75);}
  .cell.o{color:#b48cf2;text-shadow:0 0 26px rgba(180,140,242,.75);}
  .cell.pop{animation:pop .22s ease;}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.08);}100%{transform:scale(1);}}
  #strike{position:absolute;inset:-6px;pointer-events:none;}
  #strike line{
    stroke:#fff3d6;stroke-width:7;stroke-linecap:round;pathLength:1;
    stroke-dasharray:1;stroke-dashoffset:1;
    filter:drop-shadow(0 0 10px rgba(246,196,83,.95));
  }
  #strike.show line{transition:stroke-dashoffset .45s ease-out;stroke-dashoffset:0;}
  .scores{display:flex;gap:22px;font-size:13px;letter-spacing:.12em;color:rgba(244,234,208,.55);text-transform:uppercase;}
  .scores b{color:#f6c453;font-size:15px;margin-left:6px;}
  #again{
    touch-action:manipulation;cursor:pointer;display:none;
    background:rgba(246,196,83,.1);border:1px solid #f6c453;color:#ffedb8;
    border-radius:99px;padding:10px 34px;font-size:14px;letter-spacing:.14em;font-weight:700;
    box-shadow:0 0 18px rgba(246,196,83,.3);text-transform:uppercase;
  }
  #again.show{display:block;animation:pop .25s ease;}
  #again:active{transform:scale(.95);}
  .hint{font-size:11px;letter-spacing:.14em;color:rgba(244,234,208,.32);text-transform:uppercase;}
</style>
</head>
<body>
<div id="stage">
  <header>
    <a href="../index.html">‹ arcade</a>
    <span class="wordmark">LENS ARCADE</span>
    <span style="width:64px"></span>
  </header>

  <div class="seg" id="diff" role="group" aria-label="Difficulty">
    <button data-d="easy">EASY</button>
    <button data-d="medium" class="on">MEDIUM</button>
    <button data-d="hard">HARD</button>
  </div>

  <div id="status">Your move</div>

  <div id="boardwrap">
    <div id="board" aria-label="Tic-tac-toe board"></div>
    <svg id="strike" viewBox="0 0 300 300" aria-hidden="true">
      <line id="strikeline" x1="0" y1="0" x2="0" y2="0" pathLength="1"/>
    </svg>
  </div>

  <div class="scores">
    <span>You<b id="s-you">0</b></span>
    <span>AI<b id="s-ai">0</b></span>
    <span>Draws<b id="s-draw">0</b></span>
  </div>

  <button id="again">Play again</button>
  <div class="hint" id="hint">You are X · tap a square</div>
</div>

<script>
(function(){
  "use strict";
  var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var LINES = [
    [24,50,276,50],[24,150,276,150],[24,250,276,250],
    [50,24,50,276],[150,24,150,276],[250,24,250,276],
    [34,34,266,266],[266,34,34,266]
  ];
  var LS_KEY = "lensarcade_ttt_score_v1";

  var board, over, thinking, difficulty = "medium";
  var scores = {you:0, ai:0, draws:0};

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("status");
  var strikeEl = document.getElementById("strike");
  var strikeLine = document.getElementById("strikeline");
  var againBtn = document.getElementById("again");
  var hintEl = document.getElementById("hint");

  function loadScores(){
    try{
      var s = JSON.parse(localStorage.getItem(LS_KEY));
      if(s && typeof s.you === "number") scores = s;
    }catch(e){}
  }
  function saveScores(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(scores)); }catch(e){}
  }
  function paintScores(){
    document.getElementById("s-you").textContent = scores.you;
    document.getElementById("s-ai").textContent = scores.ai;
    document.getElementById("s-draw").textContent = scores.draws;
  }

  function buildBoard(){
    boardEl.innerHTML = "";
    for(var i=0;i<9;i++){
      (function(i){
        var c = document.createElement("div");
        c.className = "cell"; c.setAttribute("role","button");
        c.setAttribute("aria-label","Cell "+(i+1));
        c.addEventListener("click", function(){ onCell(i); });
        boardEl.appendChild(c);
      })(i);
    }
  }
  function cells(){ return boardEl.children; }

  function render(){
    var cs = cells();
    for(var i=0;i<9;i++){
      cs[i].textContent = board[i];
      cs[i].className = "cell" + (board[i] ? " filled " + board[i].toLowerCase() : "");
    }
  }
  function pop(i){
    var cs = cells();
    cs[i].classList.remove("pop");
    void cs[i].offsetWidth;
    cs[i].classList.add("pop");
  }

  function winnerOf(b){
    for(var k=0;k<WINS.length;k++){
      var w = WINS[k];
      if(b[w[0]] && b[w[0]]===b[w[1]] && b[w[1]]===b[w[2]]) return {player:b[w[0]], combo:k};
    }
    return null;
  }

  function setStatus(text, cls){
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  function newRound(){
    board = ["","","","","","","","",""];
    over = false; thinking = false;
    strikeEl.classList.remove("show");
    againBtn.classList.remove("show");
    hintEl.textContent = "You are X · tap a square";
    render();
    setStatus("Your move", "");
  }

  function endRound(result, combo){
    over = true;
    if(result === "X"){
      scores.you++;
      var L = LINES[combo];
      strikeLine.setAttribute("x1",L[0]); strikeLine.setAttribute("y1",L[1]);
      strikeLine.setAttribute("x2",L[2]); strikeLine.setAttribute("y2",L[3]);
      strikeEl.classList.add("show");
      setStatus("You win", "win");
      hintEl.textContent = "tap the board to play again";
    }else if(result === "O"){
      scores.ai++;
      var L2 = LINES[combo];
      strikeLine.setAttribute("x1",L2[0]); strikeLine.setAttribute("y1",L2[1]);
      strikeLine.setAttribute("x2",L2[2]); strikeLine.setAttribute("y2",L2[3]);
      strikeEl.classList.add("show");
      setStatus("AI wins", "lose");
      hintEl.textContent = "tap the board to play again";
    }else{
      scores.draws++;
      setStatus("Draw", "draw");
      hintEl.textContent = "tap the board to play again";
    }
    saveScores(); paintScores();
    againBtn.classList.add("show");
  }

  function checkEnd(){
    var w = winnerOf(board);
    if(w){ endRound(w.player, w.combo); return true; }
    if(board.every(function(c){ return c; })){ endRound("D", -1); return true; }
    return false;
  }

  function onCell(i){
    if(over){ newRound(); return; }
    if(thinking || board[i]) return;
    board[i] = "X"; render(); pop(i);
    if(checkEnd()) return;
    thinking = true;
    setStatus("AI thinking…", "thinking");
    setTimeout(aiMove, 450);
  }

  function empties(b){
    var out = [];
    for(var i=0;i<9;i++) if(!b[i]) out.push(i);
    return out;
  }

  function aiMove(){
    if(over){ thinking = false; return; }
    var move;
    if(difficulty === "easy"){
      var e = empties(board);
      move = e[Math.floor(Math.random()*e.length)];
    }else if(difficulty === "medium"){
      move = mediumMove();
    }else{
      move = bestMove();
    }
    board[move] = "O"; render(); pop(move);
    thinking = false;
    if(!checkEnd()) setStatus("Your move", "");
  }

  function mediumMove(){
    var i;
    for(i=0;i<9;i++){ // win if possible
      if(!board[i]){ board[i]="O"; if(winnerOf(board)){ board[i]=""; return i; } board[i]=""; }
    }
    for(i=0;i<9;i++){ // block if needed
      if(!board[i]){ board[i]="X"; if(winnerOf(board)){ board[i]=""; return i; } board[i]=""; }
    }
    var e = empties(board);
    return e[Math.floor(Math.random()*e.length)];
  }

  function minimax(b, isMax, depth){
    var w = winnerOf(b);
    if(w) return w.player === "O" ? 10 - depth : depth - 10;
    if(empties(b).length === 0) return 0;
    var best = isMax ? -Infinity : Infinity;
    for(var i=0;i<9;i++){
      if(!b[i]){
        b[i] = isMax ? "O" : "X";
        var s = minimax(b, !isMax, depth+1);
        b[i] = "";
        best = isMax ? Math.max(best, s) : Math.min(best, s);
      }
    }
    return best;
  }
  function bestMove(){
    var best = -Infinity, move = -1;
    var order = [4,0,2,6,8,1,3,5,7]; // prefer center/corners for variety
    for(var k=0;k<order.length;k++){
      var i = order[k];
      if(!board[i]){
        board[i] = "O";
        var s = minimax(board, false, 0);
        board[i] = "";
        if(s > best){ best = s; move = i; }
      }
    }
    return move;
  }

  document.getElementById("diff").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    var btns = this.querySelectorAll("button");
    for(var i=0;i<btns.length;i++) btns[i].classList.remove("on");
    b.classList.add("on");
    difficulty = b.getAttribute("data-d");
    newRound();
  });

  againBtn.addEventListener("click", function(e){
    e.stopPropagation();
    newRound();
  });

  loadScores(); paintScores(); buildBoard(); newRound();
})();
</script>
</body>
</html>
