<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mote · Lens Arcade</title>
<script src="../progress.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#000;color:#f4ead0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  #stage{
    width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:grid;grid-template-rows:auto auto 1fr auto auto auto;
    justify-items:center;align-items:center;
    padding:16px 28px 18px;row-gap:6px;
  }
  header{width:100%;display:flex;justify-content:space-between;align-items:center;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #meta{font-size:12px;letter-spacing:.14em;color:rgba(244,234,208,.5);text-transform:uppercase;}
  #meta .fire{color:#f6c453;}

  /* ---------- the creature ---------- */
  #mote-zone{position:relative;display:grid;place-items:center;width:100%;}
  #mote{
    --glow:#f6c453; --glow-hi:#ffedb8; --core:#8a5f08;
    position:relative;width:min(46vw,46vh,230px);height:min(46vw,46vh,230px);
    border-radius:48% 52% 55% 45% / 55% 48% 52% 45%;
    background:radial-gradient(circle at 38% 30%, var(--glow-hi) 0%, var(--glow) 42%, var(--core) 78%, #141005 100%);
    box-shadow:0 0 55px var(--glow), 0 0 130px rgba(246,196,83,.16),
               inset 0 0 34px rgba(255,250,225,.5);
    animation:breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe{50%{transform:scale(1.045) translateY(-4px);}}
  #mote.bounce{animation:boing .55s ease;}
  @keyframes boing{0%{transform:scale(1);}30%{transform:scale(1.12,.86) translateY(6px);}55%{transform:scale(.94,1.08) translateY(-14px);}75%{transform:scale(1.03,.97);}100%{transform:scale(1);}}
  #mote.wiggle{animation:wig .5s ease;}
  @keyframes wig{0%,100%{transform:rotate(0);}25%{transform:rotate(-7deg);}75%{transform:rotate(7deg);}}

  /* moods */
  #mote.hungry{--glow:#e8d9a0;--glow-hi:#fff6d8;--core:#6e5a22;animation:breathe 4.2s ease-in-out infinite, droop 5s ease-in-out infinite;}
  @keyframes droop{50%{transform:scaleY(.94) translateY(5px);}}
  #mote.bored{--glow:#8fa3c8;--glow-hi:#cfd9ee;--core:#2c3550;}
  #mote.tired{--glow:#c9a86a;--glow-hi:#f4e3bb;--core:#54401c;animation:breathe 6.5s ease-in-out infinite;}
  #mote.sleepy{--glow:#4a4a58;--glow-hi:#7a7a8c;--core:#101014;animation:breathe 7s ease-in-out infinite;}
  #mote.ecstatic{--glow:#ffd968;--glow-hi:#fffbe8;--core:#9a6f10;animation:breathe 4.2s ease-in-out infinite, joy .8s ease-in-out infinite;}
  @keyframes joy{50%{transform:translateY(-10px) scale(1.03);}}
  #mote.sad{--glow:#a89a78;--glow-hi:#d8ccab;--core:#3a3220;animation:droop 5s ease-in-out infinite;}

  /* face */
  .face{position:absolute;inset:0;}
  .eye{position:absolute;top:38%;width:15px;height:19px;border-radius:50%;background:#241a03;}
  .eye.l{left:31%;}.eye.r{right:31%;}
  .mouth{position:absolute;top:56%;left:50%;transform:translateX(-50%);
    width:26px;height:13px;border-bottom:3px solid #241a03;border-radius:0 0 26px 26px;}
  /* hungry: droopy small eyes + worried mouth */
  #mote.hungry .eye{width:11px;height:13px;top:41%;}
  #mote.hungry .mouth{border-bottom:none;border-top:3px solid #241a03;border-radius:26px 26px 0 0;height:10px;top:60%;}
  /* sad: droopy eyes + frown */
  #mote.sad .eye{width:11px;height:13px;top:41%;}
  #mote.sad .mouth{border-bottom:none;border-top:3px solid #241a03;border-radius:26px 26px 0 0;height:10px;top:60%;}
  /* bored: half-mast eyes + flat mouth */
  #mote.bored .eye{height:8px;top:41%;}
  #mote.bored .mouth{border-bottom:none;border-bottom:3px solid #241a03;border-radius:0;height:3px;width:22px;}
  /* tired: heavy-lidded eyes */
  #mote.tired .eye{height:9px;top:40%;}
  /* sleepy: closed eyes + tiny o mouth */
  #mote.sleepy .eye{width:20px;height:3px;top:42%;border-radius:3px;background:#0c0c10;}
  #mote.sleepy .mouth{width:10px;height:10px;border:2.5px solid #0c0c10;border-radius:50%;}
  /* ecstatic: happy arch eyes + open smile */
  #mote.ecstatic .eye{width:20px;height:10px;background:none;border-top:3.5px solid #241a03;border-radius:20px 20px 0 0;top:38%;}
  #mote.ecstatic .mouth{width:28px;height:15px;background:#241a03;border:none;border-radius:4px 4px 28px 28px;}

  /* sleep Z's */
  .z{position:absolute;font-weight:700;color:rgba(200,200,220,.75);opacity:0;font-size:18px;}
  #mote.sleepy .z{animation:zfloat 3.2s ease-in infinite;}
  #mote.sleepy .z.z1{top:6%;right:18%;animation-delay:0s;}
  #mote.sleepy .z.z2{top:0%;right:30%;font-size:24px;animation-delay:1.1s;}
  #mote.sleepy .z.z3{top:-6%;right:12%;font-size:14px;animation-delay:2.2s;}
  @keyframes zfloat{0%{opacity:0;transform:translateY(8px);}25%{opacity:.9;}100%{opacity:0;transform:translateY(-26px);}}
  /* ecstatic sparkles */
  .spark{position:absolute;font-size:15px;color:#fff3c4;opacity:0;text-shadow:0 0 10px #ffd968;}
  #mote.ecstatic .spark{animation:twinkle 1.1s ease-in-out infinite;}
  #mote.ecstatic .spark.s1{top:8%;left:14%;}
  #mote.ecstatic .spark.s2{top:20%;right:8%;animation-delay:.35s;}
  #mote.ecstatic .spark.s3{bottom:16%;left:8%;animation-delay:.7s;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6);}50%{opacity:1;transform:scale(1.15);}}

  .float{
    position:absolute;font-weight:800;font-size:22px;color:#ffedb8;pointer-events:none;
    text-shadow:0 0 14px rgba(246,196,83,.8);animation:rise 1.2s ease-out forwards;z-index:3;
  }
  @keyframes rise{0%{opacity:0;transform:translateY(6px);}20%{opacity:1;}100%{opacity:0;transform:translateY(-46px);}}

  #quip{min-height:24px;font-size:15px;color:rgba(244,234,208,.85);text-align:center;font-style:italic;}

  /* ---------- stat bars ---------- */
  #stats{width:100%;max-width:380px;display:grid;gap:6px;}
  .stat{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;font-size:12px;color:rgba(244,234,208,.6);}
  .stat .lbl{letter-spacing:.1em;text-transform:uppercase;}
  .track{height:6px;border-radius:99px;background:rgba(246,196,83,.12);overflow:hidden;}
  .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f6c453,#ffedb8);
    box-shadow:0 0 10px rgba(246,196,83,.7);transition:width .8s ease;}
  .stat.mid .track i{background:linear-gradient(90deg,#e8a83e,#f6c453);}
  .stat.low .track i{background:linear-gradient(90deg,#c8553e,#e88a5a);box-shadow:0 0 10px rgba(200,85,62,.7);}

  /* ---------- actions ---------- */
  #actions{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  #actions button{
    cursor:pointer;border:1px solid rgba(246,196,83,.35);border-radius:16px;
    background:rgba(246,196,83,.06);color:#f4ead0;
    font-family:inherit;font-size:16px;font-weight:600;
    padding:14px 8px;display:flex;align-items:center;justify-content:center;gap:8px;
    touch-action:manipulation;transition:transform .1s ease, background .15s ease;
  }
  #actions button .e{font-size:22px;}
  #actions button:active{transform:scale(.95);background:rgba(246,196,83,.14);}
  #actions button:disabled{opacity:.35;cursor:default;}
  @media (prefers-reduced-motion:reduce){
    #mote,#mote.hungry,#mote.ecstatic,#mote.tired,#mote.sleepy,#mote.sad{animation:none;}
    #mote.bounce,#mote.wiggle{animation:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <p id="meta"></p>
  <div id="mote-zone">
    <div id="mote" class="content" aria-label="Mote, your pet">
      <div class="face">
        <span class="eye l"></span><span class="eye r"></span><span class="mouth"></span>
      </div>
      <span class="z z1">Z</span><span class="z z2">Z</span><span class="z z3">Z</span>
      <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>
    </div>
  </div>
  <p id="quip"></p>
  <div id="stats">
    <div class="stat" id="row-hunger"><span class="lbl">🍖 Food</span><div class="track"><i id="bar-hunger"></i></div></div>
    <div class="stat" id="row-fun"><span class="lbl">🎾 Fun</span><div class="track"><i id="bar-fun"></i></div></div>
    <div class="stat" id="row-energy"><span class="lbl">⚡ Rest</span><div class="track"><i id="bar-energy"></i></div></div>
  </div>
  <div id="actions">
    <button id="btn-feed" type="button"><span class="e">🍖</span>Feed</button>
    <button id="btn-play" type="button"><span class="e">🎾</span>Play</button>
    <button id="btn-pet" type="button"><span class="e">✨</span>Pet</button>
    <button id="btn-sleep" type="button"><span class="e">💤</span><span id="sleep-label">Sleep</span></button>
  </div>
</div>
<script>
(function(){
  "use strict";
  var KEY="laMote.v1", MIN=60000, HOUR=3600000, DAY=86400000, MAX_ELAPSED=12*HOUR;
  function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}
  function $(id){return document.getElementById(id);}
  function dayStr(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}

  function freshState(now){
    return {hunger:80,fun:80,energy:80,asleep:false,
            firstVisit:now,lastVisit:now,lastDay:dayStr(now),streak:1,isNew:true};
  }
  function load(now){
    var s=null;
    try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){s=null;}
    if(!s||typeof s.hunger!=="number"){s=freshState(now);}
    else{s.isNew=false;}
    return s;
  }
  function save(s){s.lastVisit=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}

  /* decay: hunger -1/8min, fun -1/12min, energy -1/20min awake, +1/5min asleep */
  function applyDecay(s,now){
    var elapsed=Math.min(Math.max(0,now-s.lastVisit),MAX_ELAPSED);
    if(elapsed<=0)return 0;
    var m=elapsed/MIN;
    if(s.asleep){s.energy=clamp(s.energy+Math.floor(m/5));}
    else{
      s.hunger=clamp(s.hunger-Math.floor(m/8));
      s.fun=clamp(s.fun-Math.floor(m/12));
      s.energy=clamp(s.energy-Math.floor(m/20));
    }
    return elapsed;
  }
  function rollStreak(s,now){
    var today=dayStr(now);
    if(s.lastDay!==today){
      s.streak=(s.lastDay===dayStr(now-DAY))?s.streak+1:1;
      s.lastDay=today;
    }
  }
  function dayN(s,now){return Math.floor((now-s.firstVisit)/DAY)+1;}

  function deriveMood(s){
    if(s.asleep)return "sleepy";
    var low=Math.min(s.hunger,s.fun,s.energy);
    if(low<=0)return "sad";
    if(low<35){
      if(s.hunger<=s.fun&&s.hunger<=s.energy)return "hungry";
      if(s.fun<=s.hunger&&s.fun<=s.energy)return "bored";
      return "tired";
    }
    return "content";
  }

  var IDLE_QUIPS={
    content:["Mote hums happily.","Mote is happy to see you!","Mote glows a little brighter."],
    hungry:["Mote's tummy rumbles…","Is that… food? Mote hopes so."],
    bored:["Mote is bored…","Mote wants to play!"],
    tired:["Mote is getting sleepy…","Mote could use a nap."],
    sad:["Mote needs some love.","Mote looks a little droopy…"],
    sleepy:["Mote is dreaming…","Shhh… Mote is asleep."]
  };
  var ACTION_QUIPS={
    feed:["Nom nom nom!","Mote is stuffed!","Mote's favorite!"],
    play:["Wheee!","Mote loves playtime!","Again! Again!"],
    pet:["Mote purrs softly.","Mote leans into it.","Hehe, that tickles!"],
    wake:["Mote stretches… good to be up!","Mote blinks awake."]
  };

  var mote=$("mote"),quip=$("quip"),zone=$("mote-zone"),flashTimer=null;

  function setMood(m){
    mote.className=m;
  }
  function paint(s,now){
    var mood=deriveMood(s);
    setMood(mood);
    $("bar-hunger").style.width=s.hunger+"%";
    $("bar-fun").style.width=s.fun+"%";
    $("bar-energy").style.width=s.energy+"%";
    [["hunger",s.hunger],["fun",s.fun],["energy",s.energy]].forEach(function(p){
      var row=$("row-"+p[0]);
      row.classList.toggle("low",p[1]<25);
      row.classList.toggle("mid",p[1]>=25&&p[1]<55);
    });
    $("meta").innerHTML="Day "+dayN(s,now)+" together · <span class='fire'>🔥</span> x"+s.streak;
    var dis=s.asleep;
    $("btn-feed").disabled=dis;$("btn-play").disabled=dis;$("btn-pet").disabled=dis;
    $("sleep-label").textContent=s.asleep?"Wake":"Sleep";
    $("btn-sleep").querySelector(".e").textContent=s.asleep?"☀️":"💤";
  }
  function say(t){quip.textContent=t;}
  function floatText(txt){
    var f=document.createElement("span");
    f.className="float";f.textContent=txt;
    f.style.left=(38+Math.random()*24)+"%";f.style.top="18%";
    zone.appendChild(f);
    f.addEventListener("animationend",function(){f.remove();});
  }
  function animate(kind){
    mote.classList.remove("bounce","wiggle");void mote.offsetWidth;
    mote.classList.add(kind);
  }
  function happyFlash(s,now){
    setMood("ecstatic");
    clearTimeout(flashTimer);
    flashTimer=setTimeout(function(){paint(s,Date.now());},2200);
  }

  function doFeed(s,now){
    if(s.asleep)return;
    s.hunger=clamp(s.hunger+25);
    if(window.ArcadeProgress)ArcadeProgress.award("pet","care",5);
    animate("bounce");floatText("+25");say(pick(ACTION_QUIPS.feed));
    happyFlash(s,now);save(s);paint(s,now);
  }
  function doPlay(s,now){
    if(s.asleep)return;
    s.fun=clamp(s.fun+25);s.energy=clamp(s.energy-10);
    if(window.ArcadeProgress)ArcadeProgress.award("pet","care",5);
    animate("wiggle");floatText("+25");say(pick(ACTION_QUIPS.play));
    happyFlash(s,now);save(s);paint(s,now);
  }
  function doPet(s,now){
    if(s.asleep)return;
    s.fun=clamp(s.fun+10);
    if(window.ArcadeProgress)ArcadeProgress.award("pet","care",5);
    animate("bounce");floatText("+10");say(pick(ACTION_QUIPS.pet));
    happyFlash(s,now);save(s);paint(s,now);
  }
  function doSleep(s,now){
    s.asleep=!s.asleep;
    animate("bounce");
    say(s.asleep?pick(["Mote curls up… goodnight.","Mote drifts off to sleep."]):pick(ACTION_QUIPS.wake));
    save(s);paint(s,now);
  }

  /* ---------- boot ---------- */
  var now=Date.now();
  var s=load(now);
  var awayMs=0;
  if(s.isNew){
    say("A wild Mote appears! It's Day 1.");
  }else{
    awayMs=applyDecay(s,now);
    rollStreak(s,now);
    if(awayMs>30*MIN&&!s.asleep){say("Mote missed you!");}
    else{say(pick(IDLE_QUIPS[deriveMood(s)]));}
  }
  save(s);paint(s,now);

  $("btn-feed").addEventListener("click",function(){doFeed(s,Date.now());});
  $("btn-play").addEventListener("click",function(){doPlay(s,Date.now());});
  $("btn-pet").addEventListener("click",function(){doPet(s,Date.now());});
  $("btn-sleep").addEventListener("click",function(){doSleep(s,Date.now());});
})();
</script>
</body>
</html>
