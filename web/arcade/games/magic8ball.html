<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Magic 8 Ball · Lens Arcade</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#000;color:#f4ead0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:18px 30px;row-gap:8px;}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #ball-zone{display:grid;place-items:center;width:100%;}
  #ball{
    width:min(64vw,64vh,340px);height:min(64vw,64vh,340px);border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 28%, #3a3a44 0%, #141419 45%, #000 100%);
    border:2px solid rgba(246,196,83,.35);
    box-shadow:0 0 60px rgba(246,196,83,.18), inset -14px -20px 50px rgba(0,0,0,.9);
    display:grid;place-items:center;position:relative;
    transition:transform .12s ease;
  }
  #ball:active{transform:scale(.96);}
  #ball.shake{animation:shake .6s ease;}
  @keyframes shake{
    0%,100%{transform:rotate(0);}
    20%{transform:rotate(-9deg) translateX(-8px);}
    40%{transform:rotate(8deg) translateX(7px);}
    60%{transform:rotate(-6deg) translateX(-5px);}
    80%{transform:rotate(4deg) translateX(3px);}
  }
  #window{
    width:46%;height:46%;border-radius:50%;background:#0a0f1e;
    border:1px solid rgba(140,170,255,.25);
    display:grid;place-items:center;padding:12%;text-align:center;
    box-shadow:inset 0 0 24px rgba(20,40,120,.5);
  }
  #answer{
    font-size:clamp(13px,3.4vmin,19px);font-weight:700;color:#cfe0ff;
    text-shadow:0 0 12px rgba(140,170,255,.7);line-height:1.35;
    opacity:0;transition:opacity .4s ease;
  }
  #answer.show{opacity:1;}
  #hint{font-size:13px;color:rgba(244,234,208,.45);letter-spacing:.08em;text-align:center;line-height:1.7;}
  #hint b{color:rgba(246,196,83,.8);}
  #count{font-size:11px;letter-spacing:.24em;color:rgba(244,234,208,.3);text-transform:uppercase;}
  @media (prefers-reduced-motion:reduce){#ball.shake{animation:none;}}
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <div id="ball-zone">
    <div id="ball" role="button" tabindex="0" aria-label="Shake the 8 ball">
      <div id="window"><p id="answer"></p></div>
    </div>
  </div>
  <div>
    <p id="hint">Think of a yes-or-no question.<br>Ask it out loud, then <b>tap the ball</b>.</p>
    <p id="count" style="text-align:center;margin-top:10px;"></p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var ANSWERS=[
    "IT IS CERTAIN","IT IS DECIDEDLY SO","WITHOUT A DOUBT","YES DEFINITELY",
    "YOU MAY RELY ON IT","AS I SEE IT, YES","MOST LIKELY","OUTLOOK GOOD",
    "YES","SIGNS POINT TO YES","REPLY HAZY, TRY AGAIN","ASK AGAIN LATER",
    "BETTER NOT TELL YOU NOW","CANNOT PREDICT NOW","CONCENTRATE AND ASK AGAIN",
    "DON'T COUNT ON IT","MY REPLY IS NO","OUTLOOK NOT SO GOOD","VERY DOUBTFUL","NO"
  ];
  var ball=document.getElementById("ball"),
      answer=document.getElementById("answer"),
      count=document.getElementById("count"),
      asked=parseInt(localStorage.getItem("la8ball")||"0",10),
      busy=false;
  function paint(){count.textContent=asked+(asked===1?" question asked":" questions asked");}
  function shake(){
    if(busy)return;busy=true;
    answer.classList.remove("show");
    ball.classList.remove("shake");void ball.offsetWidth;ball.classList.add("shake");
    setTimeout(function(){
      answer.textContent=ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
      answer.classList.add("show");
      asked++;localStorage.setItem("la8ball",String(asked));paint();
      busy=false;
    },620);
  }
  ball.addEventListener("click",shake);
  ball.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();shake();}});
  paint();
})();
</script>
</body>
</html>
