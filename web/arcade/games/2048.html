<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>2048 · Lens Arcade</title>
<script src="../progress.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#000;color:#f4ead0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;}
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);max-width:600px;max-height:600px;
    display:grid;grid-template-rows:auto auto 1fr auto;justify-items:stretch;padding:16px 28px;row-gap:10px;}
  header{display:flex;justify-content:space-between;align-items:center;}
  header .wm{font-size:11px;letter-spacing:.3em;color:rgba(246,196,83,.55);font-weight:700;}
  header a{font-size:13px;color:rgba(244,234,208,.5);text-decoration:none;}
  #hud{display:flex;justify-content:space-between;align-items:center;}
  #hud h1{font-size:34px;font-weight:800;color:#ffedb8;letter-spacing:.02em;}
  .scores{display:flex;gap:8px;align-items:center;}
  .pill{background:rgba(246,196,83,.1);border:1px solid rgba(246,196,83,.25);border-radius:10px;
    padding:6px 12px;text-align:center;min-width:76px;}
  .pill .lab{font-size:10px;letter-spacing:.2em;color:rgba(244,234,208,.45);}
  .pill .val{font-size:18px;font-weight:800;color:#ffedb8;}
  #newbtn{background:none;border:1px solid rgba(246,196,83,.4);color:#f6c453;border-radius:10px;
    font-size:18px;padding:6px 12px;cursor:pointer;}
  #boardwrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #board{position:relative;aspect-ratio:1/1;
    background:#0b0b0d;border:1px solid rgba(246,196,83,.22);border-radius:16px;touch-action:none;
    box-shadow:0 0 30px rgba(246,196,83,.07);}
  .cell{position:absolute;background:rgba(255,255,255,.055);border-radius:10px;}
  #tiles{position:absolute;inset:0;}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-weight:800;color:#f4ead0;
    transition:transform 110ms ease-in-out;}
  .tile.pop{animation:pop 160ms ease-out;}
  @keyframes pop{0%{transform:scale(.6);}60%{transform:scale(1.08);}}
  .tile[data-v="2"]{background:#26262b;}
  .tile[data-v="4"]{background:#35311f;}
  .tile[data-v="8"]{background:#6e4416;color:#ffe9bd;}
  .tile[data-v="16"]{background:#7d4f18;color:#ffe9bd;}
  .tile[data-v="32"]{background:#8a3a1d;color:#ffe9bd;}
  .tile[data-v="64"]{background:#99351a;color:#ffe9bd;}
  .tile[data-v="128"]{background:#a87c22;color:#fff3d0;box-shadow:0 0 14px rgba(246,196,83,.35);}
  .tile[data-v="256"]{background:#bd8c26;color:#fff3d0;box-shadow:0 0 16px rgba(246,196,83,.4);}
  .tile[data-v="512"]{background:#d29c2c;color:#fff3d0;box-shadow:0 0 18px rgba(246,196,83,.5);}
  .tile[data-v="1024"]{background:#e6ac33;color:#1a1206;box-shadow:0 0 22px rgba(246,196,83,.6);}
  .tile[data-v="2048"]{background:#ffe27a;color:#1a1206;box-shadow:0 0 30px rgba(255,226,122,.8);}
  .tile[data-v="4096"],.tile[data-v="8192"]{background:#fff;color:#1a1206;box-shadow:0 0 30px rgba(255,255,255,.7);}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:rgba(0,0,0,.72);border-radius:16px;z-index:5;text-align:center;}
  #overlay.show{display:flex;}
  #overlay h2{font-size:44px;font-weight:800;color:#ffedb8;text-shadow:0 0 24px rgba(246,196,83,.6);}
  #overlay p{font-size:15px;color:rgba(244,234,208,.7);}
  #winbanner{display:none;text-align:center;font-size:14px;font-weight:700;color:#ffe27a;
    text-shadow:0 0 12px rgba(255,226,122,.6);letter-spacing:.1em;}
  #winbanner.show{display:block;animation:pop 300ms ease-out;}
  #hint{font-size:12px;color:rgba(244,234,208,.35);text-align:center;letter-spacing:.06em;}
  @media (prefers-reduced-motion:reduce){.tile{transition:none;}.tile.pop{animation:none;}}
</style>
</head>
<body>
<div id="stage">
  <header><span class="wm">LENS ARCADE</span><a href="../index.html">‹ arcade</a></header>
  <div id="hud">
    <h1>2048</h1>
    <div class="scores">
      <div class="pill"><div class="lab">SCORE</div><div class="val" id="score">0</div></div>
      <div class="pill"><div class="lab">BEST</div><div class="val" id="best">0</div></div>
      <button id="newbtn" aria-label="New game">↺</button>
    </div>
  </div>
  <div id="boardwrap">
    <div id="board" role="application" aria-label="2048 — swipe to slide tiles">
      <div id="tiles"></div>
      <div id="overlay"><h2 id="ovtitle"></h2><p id="ovsub"></p></div>
    </div>
  </div>
  <div>
    <div id="winbanner">✨ 2048! LEGENDARY ✨</div>
    <p id="hint">swipe to slide · merge to 2048</p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var N=4, tiles=[], nextId=1, score=0, over=false, won=false, inputOn=true;
  var BEST="la2048Best", best=0;
  try{best=parseInt(localStorage.getItem(BEST)||"0",10)||0;}catch(e){}
  var board=document.getElementById("board"),tilesEl=document.getElementById("tiles"),
      boardwrap=document.getElementById("boardwrap"),
      scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),
      overlay=document.getElementById("overlay"),ovtitle=document.getElementById("ovtitle"),
      ovsub=document.getElementById("ovsub"),winbanner=document.getElementById("winbanner");
  bestEl.textContent=best;

  var cellPx=0,gapPx=0;
  function layout(){
    // fit the board inside BOTH dimensions of its row — never overlap the HUD
    var size=Math.min(boardwrap.clientWidth,boardwrap.clientHeight,440);
    size=Math.max(200,size||200);
    board.style.width=board.style.height=size+"px";
    var w=board.clientWidth||size;
    cellPx=w/N;gapPx=Math.max(6,cellPx*0.09);
    // background cells
    board.querySelectorAll(".cell").forEach(function(c){c.remove();});
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var c=document.createElement("div");c.className="cell";
      var s=cellPx-gapPx;
      c.style.width=c.style.height=s+"px";
      c.style.left=(x*cellPx+gapPx/2)+"px";
      c.style.top=(y*cellPx+gapPx/2)+"px";
      board.insertBefore(c,tilesEl);
    }
    tiles.forEach(positionTile);
  }
  function positionTile(t){
    if(!t.el)return;
    var s=cellPx-gapPx;
    t.el.style.width=t.el.style.height=s+"px";
    t.el.style.transform="translate("+(t.col*cellPx+gapPx/2)+"px,"+(t.row*cellPx+gapPx/2)+"px)";
    var digits=String(t.value).length;
    t.el.style.fontSize=Math.round(s/(digits>4?3.4:digits>2?2.6:2))+"px";
  }
  function at(r,c){
    for(var i=0;i<tiles.length;i++){var t=tiles[i];if(t.row===r&&t.col===c)return t;}
    return null;
  }
  function emptyCells(){
    var cells=[];
    for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!at(r,c))cells.push({r:r,c:c});
    return cells;
  }
  function spawn(){
    var cells=emptyCells();if(!cells.length)return;
    var p=cells[Math.floor(Math.random()*cells.length)];
    tiles.push({id:nextId++,value:Math.random()<0.9?2:4,row:p.r,col:p.c,fresh:true});
  }
  function render(popId){
    tiles.forEach(function(t){
      if(!t.el){
        t.el=document.createElement("div");
        t.el.className="tile";
        if(t.fresh)t.el.classList.add("pop");
        tilesEl.appendChild(t.el);
      }
      t.el.textContent=t.value;
      t.el.setAttribute("data-v",t.value>8192?"8192":t.value);
      positionTile(t);
      if(t.id===popId){t.el.classList.remove("pop");void t.el.offsetWidth;t.el.classList.add("pop");}
      t.fresh=false;
    });
    scoreEl.textContent=score;
  }
  function cleanupDead(){
    // remove absorbed tiles after their slide finishes
    var dead=tiles.filter(function(t){return t.dead;});
    dead.forEach(function(t){
      setTimeout(function(){if(t.el){t.el.remove();}},130);
    });
    tiles=tiles.filter(function(t){return !t.dead;});
  }
  var VECTORS=[{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}]; // up right down left
  function traversals(v){
    var tx=[],ty=[];
    for(var i=0;i<N;i++){tx.push(i);ty.push(i);}
    if(v.x===1)tx.reverse();
    if(v.y===1)ty.reverse();
    return {x:tx,y:ty};
  }
  function move(dir){
    if(over||!inputOn)return;
    var v=VECTORS[dir],tr=traversals(v),moved=false,popId=0;
    tiles.forEach(function(t){t.merged=false;});
    tr.y.forEach(function(r){
      tr.x.forEach(function(c){
        var t=at(r,c);
        if(!t||t.dead)return;
        // find farthest open cell
        var fr=r,fc=c,nr=r+v.y,nc=c+v.x;
        while(nr>=0&&nr<N&&nc>=0&&nc<N&&!at(nr,nc)){fr=nr;fc=nc;nr+=v.y;nc+=v.x;}
        var target=(nr>=0&&nr<N&&nc>=0&&nc<N)?at(nr,nc):null;
        if(target&&!target.merged&&target.value===t.value){
          var m={id:nextId++,value:t.value*2,row:target.row,col:target.col};
        m.merged=true; // a tile born from a merge can't merge again this turn
          t.row=target.row;t.col=target.col;t.dead=true;
          target.dead=true;
          tiles=tiles.filter(function(x){return x!==t&&x!==target;});
          tiles.push(m);
          score+=m.value;popId=m.id;moved=true;
          if(m.value===2048&&!won){won=true;onWin();}
        }else if(fr!==r||fc!==c){
          t.row=fr;t.col=fc;moved=true;
        }
      });
    });
    if(moved){
      render(popId);
      cleanupDead();
      spawn();render(0);
      if(score>best){best=score;bestEl.textContent=best;
        try{localStorage.setItem(BEST,String(best));}catch(e){}
        if(window.ArcadeProgress)ArcadeProgress.award("2048","newbest",50);
      }
      checkOver();
    }
  }
  function onWin(){
    winbanner.classList.add("show");
    if(window.ArcadeProgress)ArcadeProgress.award("2048","win2048",60);
  }
  function movesAvailable(){
    if(emptyCells().length)return true;
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var t=at(r,c);
      if(!t)continue;
      var n=at(r+1,c),m=at(r,c+1);
      if((n&&n.value===t.value)||(m&&m.value===t.value))return true;
    }
    return false;
  }
  function checkOver(){
    if(!movesAvailable()){
      over=true;inputOn=false;
      var isBest=score>=best&&score>0;
      ovtitle.textContent="GAME OVER";
      ovsub.textContent="score "+score+" · best "+best+" · tap to retry";
      overlay.classList.add("show");
      if(window.ArcadeProgress)ArcadeProgress.award("2048","played",10);
    }
  }
  function reset(){
    tiles.forEach(function(t){if(t.el)t.el.remove();});
    tiles=[];nextId=1;score=0;over=false;won=false;inputOn=true;
    overlay.classList.remove("show");winbanner.classList.remove("show");
    spawn();spawn();render(0);
  }
  // swipe input
  var sx=0,sy=0,tracking=false;
  board.addEventListener("touchstart",function(e){
    var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;tracking=true;
  },{passive:true});
  board.addEventListener("touchend",function(e){
    if(!tracking)return;tracking=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);
  },{passive:true});
  // mouse swipe for desktop testing
  var mdown=false,mx=0,my=0;
  board.addEventListener("pointerdown",function(e){mdown=true;mx=e.clientX;my=e.clientY;});
  board.addEventListener("pointerup",function(e){
    if(!mdown)return;mdown=false;
    var dx=e.clientX-mx,dy=e.clientY-my;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);
  });
  document.addEventListener("keydown",function(e){
    var d={"ArrowUp":0,"ArrowRight":1,"ArrowDown":2,"ArrowLeft":3}[e.key];
    if(d!==undefined){e.preventDefault();move(d);}
  });
  overlay.addEventListener("click",reset);
  document.getElementById("newbtn").addEventListener("click",function(e){e.stopPropagation();reset();});
  window.addEventListener("resize",layout);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){try{localStorage.setItem(BEST,String(best));}catch(e){}}
  });

  layout();reset();
  requestAnimationFrame(function(){requestAnimationFrame(layout);});
})();
</script>
</body>
</html>
