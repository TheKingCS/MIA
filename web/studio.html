<body data-say="Make the accent purple." data-app="studio" class="mod-studio">
  <!--
    The Theme Studio (DEC-0136, Zac 2026-11-08): start from a theme, tweak its colours, corners, font, material and
    the 3D room's light, see it on this whole page and in a little room as you go, then save it as your own.
    MIA.themes() (core/themes.studio); the tokens are built in core on save (core/themes.build_theme, the same
    arithmetic as here); saving and deleting are actions (theme.save, theme.delete). Formatting only (claude).
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1>Theme Studio</h1>
        <p class="tagline">Make MIA look like you. Every change shows here as you make it.</p>
      </header>
      <div id="panel"></div>
    </main>
  </div>

</body>
