  <link rel="stylesheet" href="tokens.css">

<body data-app="taught_skills" class="mod-taught-skills">
  <!--
    Taught Skills (claude, 2026-11-15, DEC-0123): what the person taught MIA, made of things she can
    already do. The run waiting on you, what she's watching, and each skill with its steps in words,
    how practised it is, and which steps ask every time. MIA.taughtSkills() (core/web_taught_skills.py),
    changes in core/taught_skill_actions.py, runs through /api/taught-skills/run|answer|stop.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🎓</span> <span id="hero-name">Taught Skills</span></h1>
        <p class="tagline" id="hero-tagline">Show her once. Practise together.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="shell.js"></script>
  <script src="taught-skills.js"></script>
</body>
