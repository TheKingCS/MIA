<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>The Dungeon — MIA</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="concept.css">

<body data-app="dungeon" class="mod-dungeon">
  <!--
    The Dungeon (claude, 2026-10-27, DEC-0046): work as a dungeon you loot
    every day. Clear today's run (with what made it hard mode), plan runs,
    projected and banked loot, overtime bosses, the hard-mode record, and the
    next dungeon (Freedom). MIA.dungeon() (core/web_dungeon.py), actions in
    core/dungeon_actions.py.
  -->
  <div class="layout" id="app" hidden>
    <nav class="side" aria-label="Apps"></nav>
    <main class="layout-main">
      <header class="hero">
        <h1><span aria-hidden="true" id="hero-icon">🏰</span> <span id="hero-name">The Dungeon</span></h1>
        <p class="tagline" id="hero-tagline">Clear the run. Bank the loot.</p>
      </header>
      <section class="strip" id="strip" aria-label="Status"></section>
      <div class="ptabs" role="tablist" id="tabs" hidden></div>
      <div id="panel"></div>
    </main>
  </div>
  <script src="mia.js"></script>
  <script src="icons.js"></script>
  <script src="sound.js"></script>
  <script src="places-watch.js"></script>
  <script src="shell.js"></script>
  <script src="dungeon.js"></script>
</body>
</html>
