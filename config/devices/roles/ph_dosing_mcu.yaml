role: ph_dosing_mcu
display_name: "pH Dosing Controller"
description: >
  Controls both pH-up and pH-down dosing pumps for a cell.

port_label: "PORT 2 — PH DOSING"
mount_location: "Mount next to the pH-up/pH-down solution bottles, Cell A."
default_cell_id: 1

controls:
  - actuator_type: dosing_pump
    actuator_name: ph_up_pump
    safe_default_state: "off"
    relay_channel: 1
    wiring_rationale: >
      Channel 1 chosen because it's the first (leftmost) relay on the
      board, closest to the MCU's 5V input — shortest wire run to the
      relay's control-side power, reducing voltage drop on a channel
      that fires frequently.
  - actuator_type: dosing_pump
    actuator_name: ph_down_pump
    safe_default_state: "off"
    relay_channel: 2
    wiring_rationale: >
      Channel 2, adjacent to ph_up_pump's channel 1 — keeping both pH
      pumps on neighboring channels makes the physical wiring easier
      to trace and reduces the chance of miswiring during maintenance.

setup_instructions: |
  1. Find the MCU labeled "PH DOSING" in the parts bin (blue label).
  2. Plug it into PORT 2 on the Pi expansion hub.
  3. Mount it next to the pH-up/pH-down solution bottles in Cell A.
  4. Power it on — MIA Homestead detects it automatically within a
     few seconds.
  5. Once detected, the system confirms pairing on its own. If it
     doesn't pair within a minute, double-check the connection.
